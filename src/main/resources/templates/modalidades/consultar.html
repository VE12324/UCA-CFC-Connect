<!DOCTYPE html>


<html lang="es" xmlns:th="http://www.thymeleaf.org">


<head>


    <meta charset="UTF-8">


    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">


    <title>Detalle de modalidad</title>


    <link rel="stylesheet"
          href="/css/estilos.css"
          th:href="@{/css/estilos.css}">


</head>


<body>


<div class="aplicacion">


    <aside th:replace="~{fragmentos/plantilla :: barra-lateral('modalidades')}"></aside>


    <section class="area-principal">


        <header th:replace="~{fragmentos/plantilla :: barra-superior}"></header>


        <main class="contenido">


            <div class="detalle-tarjeta">


                <div class="tarjeta-encabezado">


                    <h1 th:text="${modalidad.nombre}">
                        Detalle de modalidad
                    </h1>


                    <p>
                        Ficha de información de la modalidad.
                    </p>


                </div>


                <div class="tarjeta-cuerpo">


                    <div class="detalles-cuadricula">


                        <div class="detalle-item">


                            <div class="detalle-etiqueta">
                                ID
                            </div>


                            <div class="detalle-valor"
                                 th:text="${modalidad.idModalidad}">
                                1
                            </div>


                        </div>


                        <div class="detalle-item ancho-completo">


                            <div class="detalle-etiqueta">
                                Descripción
                            </div>


                            <div class="detalle-valor"
                                 th:text="${modalidad.descripcion != null && !modalidad.descripcion.isBlank()
                                         ? modalidad.descripcion
                                         : 'Sin descripción'}">
                                Descripción de la modalidad
                            </div>


                        </div>


                    </div>


                    <div class="acciones-formulario">


                        <a class="boton-secundario"
                           href="/modalidades"
                           th:href="@{/modalidades}">
                            Volver al catálogo
                        </a>


                        <a class="boton-guardar"
                           href="#"
                           th:href="@{/modalidades/actualizar/{id}(id=${modalidad.idModalidad})}">
                            Editar información
                        </a>


                    </div>


                </div>


            </div>


        </main>


    </section>


</div>


</body>


</html>
