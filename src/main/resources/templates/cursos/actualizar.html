<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar Curso</title>
    <link rel="stylesheet" href="/css/estilos.css" data-th-href="@{/css/estilos.css}">
</head>
<body>
<div class="aplicacion">
    <aside th:replace="~{fragmentos/plantilla :: barra-lateral('cursos')}"></aside>

    <section class="area-principal">
        <main class="contenido">
            <div class="formulario-tarjeta">
                <div class="tarjeta-encabezado">
                    <h1>Actualizar Registro Académico</h1>
                    <p>Modifique los datos operativos del curso o diplomado seleccionado.</p>
                </div>

                <div class="tarjeta-cuerpo">
                    <form data-th-action="@{/cursos/actualizar/{id}(id=${curso.idCurso})}" data-th-object="${curso}" method="post">
                        <input type="hidden" data-th-field="*{idCurso}"/>

                        <div class="formulario-cuadricula">
                            <div class="grupo-formulario ancho-completo">
                                <label for="nombre">Nombre del Curso *</label>
                                <input class="campo-formulario" id="nombre" type="text" data-th-field="*{nombre}" data-th-classappend="${#fields.hasErrors('nombre')} ? 'invalido' : ''">
                                <span class="texto-error" data-th-if="${#fields.hasErrors('nombre')}" data-th-errors="*{nombre}"></span>
                            </div>

                            <div class="grupo-formulario">
                                <label for="categoria">Categoría *</label>
                                <select class="campo-formulario" id="categoria" data-th-field="*{categoria.idCategoria}" required>
                                    <option data-th-each="cat : ${categorias}" data-th-value="${cat.idCategoria}" data-th-text="${cat.nombre}"></option>
                                </select>
                            </div>

                            <div class="grupo-formulario">
                                <label for="modalidad">Modalidad *</label>
                                <select class="campo-formulario" id="modalidad" data-th-field="*{modalidad.idModalidad}" required>
                                    <option data-th-each="m : ${modalidades}" data-th-value="${m.idModalidad}" data-th-text="${m.nombre}"></option>
                                </select>
                            </div>

                            <div class="grupo-formulario ancho-completo">
                                <label for="descripcion">Descripción</label>
                                <textarea class="campo-formulario" id="descripcion" data-th-field="*{descripcion}"></textarea>
                            </div>

                            <div class="grupo-formulario ancho-completo">
                                <label for="docente">Docente Asignado *</label>
                                <select class="campo-formulario" id="docente" data-th-field="*{docente.idDocente}" required>
                                    <option data-th-each="doc : ${docentes}" data-th-value="${doc.idDocente}" data-th-text="${doc.nombre + ' ' + doc.apellido}"></option>
                                </select>
                            </div>

                            <div class="grupo-formulario">
                                <label for="fechaInicio">Fecha de Inicio *</label>
                                <input class="campo-formulario" id="fechaInicio" type="date" data-th-field="*{fechaInicio}" required>
                            </div>

                            <div class="grupo-formulario">
                                <label for="fechaFin">Fecha de Fin *</label>
                                <input class="campo-formulario" id="fechaFin" type="date" data-th-field="*{fechaFin}" data-th-classappend="${#fields.hasErrors('fechaFin')} ? 'invalido' : ''" required>
                                <span class="texto-error" data-th-if="${#fields.hasErrors('fechaFin')}" data-th-errors="*{fechaFin}"></span>
                            </div>

                            <div class="grupo-formulario">
                                <label for="cupoMaximo">Cupo Máximo *</label>
                                <input class="campo-formulario" id="cupoMaximo" type="number" min="1" data-th-field="*{cupoMaximo}" required>
                            </div>

                            <div class="grupo-formulario">
                                <label for="costo">Costo (USD) *</label>
                                <input class="campo-formulario" id="costo" type="number" step="0.01" min="0" data-th-field="*{costo}" required>
                            </div>

                            <div class="grupo-formulario ancho-completo">
                                <label for="estado">Estado *</label>
                                <select class="campo-formulario" id="estado" data-th-field="*{estado}">
                                    <option value="ACTIVO">ACTIVO</option>
                                    <option value="INACTIVO">INACTIVO</option>
                                </select>
                            </div>
                        </div>

                        <div class="acciones-formulario">
                            <a class="boton-secundario" href="/cursos" data-th-href="@{/cursos}">Cancelar</a>
                            <button class="boton-guardar" type="submit">Actualizar Curso</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </section>
</div>
</body>
</html>
