<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — UCA CFC Connect</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-pagina">

<header class="auth-barra">
    <a class="auth-boton-cambio" th:href="@{/registro}" href="/registro">Registro</a>
</header>

<main class="auth-contenedor">
    <div class="auth-tarjeta">

        <img class="auth-logo"
             th:src="@{/iconos/logo.png}"
             src="/iconos/logo.png"
             alt="UCA Logo">

        <h1 class="auth-titulo">Iniciar sesión</h1>
        <p class="auth-subtitulo">Centro de Formación Continua</p>

        <div class="mensaje mensaje-error"
             th:if="${param.error}">
            Correo o contraseña incorrectos. Verifique sus datos.
        </div>

        <div class="mensaje mensaje-exito"
             th:if="${param.logout}">
            Ha cerrado sesión correctamente.
        </div>

        <div class="mensaje mensaje-exito"
             th:if="${param.correoActualizado}">
            Tu correo se actualizó. Inicia sesión con tu nuevo correo.
        </div>

        <div class="mensaje mensaje-exito"
             th:if="${mensajeExito}"
             th:text="${mensajeExito}">
        </div>

        <form th:action="@{/login}" method="post">

            <div class="grupo-formulario">
                <label for="username">Correo electrónico</label>
                <input class="campo-formulario"
                       type="email"
                       id="username"
                       name="username"
                       th:value="${correoRegistrado}"
                       placeholder="correo@uca.edu.sv"
                       autocomplete="email"
                       required>
            </div>

            <div class="grupo-formulario">
                <label for="password">Contraseña</label>
                <div class="auth-campo-password">
                    <input class="campo-formulario"
                           type="password"
                           id="password"
                           name="password"
                           placeholder="••••••••"
                           autocomplete="current-password"
                           required>
                    <button class="auth-ojo"
                            type="button"
                            data-objetivo="password"
                            aria-pressed="false"
                            aria-label="Mostrar contraseña">
                        <svg class="icono-mostrar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="icono-ocultar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2"/><path d="M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                    </button>
                </div>
            </div>

            <button class="auth-boton" type="submit">Iniciar sesión</button>

        </form>

        <p class="auth-enlace-alterno">
            ¿No tienes cuenta?
            <a th:href="@{/registro}" href="/registro">Regístrate</a>
        </p>
    </div>
</main>

<footer class="auth-pie">
    UCA CFC Connect &copy; 2026
</footer>

<script th:src="@{/js/auth.js}" src="/js/auth.js"></script>
</body>
</html>
