<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — UCA CFC Connect</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--neutral);
        }

        .login-contenedor {
            width: 100%;
            max-width: 420px;
            padding: 24px;
        }

        .login-tarjeta {
            overflow: hidden;
            border: 1px solid var(--borde);
            border-radius: var(--radio);
            background-color: var(--blanco);
            box-shadow: var(--sombra);
        }

        .login-encabezado {
            padding: 36px 36px 28px;
            text-align: center;
            border-bottom: 1px solid var(--borde);
            background-color: var(--primario);
        }

        .login-logo {
            display: block;
            width: 160px;
            height: auto;
            margin: 0 auto 16px;
            object-fit: contain;
        }

        .login-titulo {
            color: var(--blanco);
            font-size: 15px;
            font-weight: 600;
            opacity: 0.9;
        }

        .login-cuerpo {
            padding: 32px 36px;
        }

        .login-cuerpo .grupo-formulario {
            margin-bottom: 20px;
        }

        .login-cuerpo label {
            display: block;
            margin-bottom: 7px;
            color: #3d474c;
            font-size: 13px;
            font-weight: 600;
        }

        .login-boton {
            width: 100%;
            min-height: 46px;
            margin-top: 8px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--primario);
            border-radius: 8px;
            background-color: var(--primario);
            color: var(--blanco);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-boton:hover {
            background-color: var(--primario-oscuro);
            border-color: var(--primario-oscuro);
        }

        .login-pie {
            padding: 16px 36px;
            text-align: center;
            border-top: 1px solid var(--borde);
            background-color: #fbfcfc;
            color: var(--texto-suave);
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="login-contenedor">
    <div class="login-tarjeta">

        <div class="login-encabezado">
            <img class="login-logo"
                 th:src="@{/iconos/logo.png}"
                 src="/iconos/logo.png"
                 alt="UCA Logo">
            <p class="login-titulo">Centro de Formación Continua</p>
        </div>

        <div class="login-cuerpo">

            <div class="mensaje mensaje-error"
                 th:if="${param.error}">
                Correo o contraseña incorrectos. Verifique sus datos.
            </div>

            <div class="mensaje mensaje-exito"
                 th:if="${param.logout}">
                Ha cerrado sesión correctamente.
            </div>

            <div class="mensaje mensaje-error"
                 th:if="${param.containsKey('acceso-denegado')}">
                No tiene permisos para acceder a esa sección.
            </div>

            <form th:action="@{/login}" method="post">

                <div class="grupo-formulario">
                    <label for="username">Correo electrónico</label>
                    <input class="campo-formulario"
                           type="email"
                           id="username"
                           name="username"
                           placeholder="correo@uca.edu.sv"
                           autocomplete="email"
                           required>
                </div>

                <div class="grupo-formulario">
                    <label for="password">Contraseña</label>
                    <input class="campo-formulario"
                           type="password"
                           id="password"
                           name="password"
                           placeholder="••••••••"
                           autocomplete="current-password"
                           required>
                </div>

                <button class="login-boton" type="submit">Iniciar sesión</button>

            </form>
        </div>

        <div class="login-pie">
            UCA CFC Connect &copy; 2024 &mdash; Universidad Centroamericana
        </div>

    </div>
</div>

</body>
</html>
