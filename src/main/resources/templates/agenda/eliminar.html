<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Actividad</title>
    <link rel="stylesheet" href="/css/estilos.css" th:href="@{/css/estilos.css}">
</head>
<body>

<div class="aplicacion">

    <aside th:replace="~{fragmentos/plantilla :: barra-lateral('agenda')}"></aside>

    <section class="area-principal">

        <header th:replace="~{fragmentos/plantilla :: barra-superior}"></header>

        <main class="contenido">

            <div class="eliminar-tarjeta">

                <div class="tarjeta-encabezado">
                    <h1>Eliminar Actividad</h1>
                    <p>Confirme la eliminación de la actividad.</p>
                </div>

                <div class="tarjeta-cuerpo">

                    <div class="advertencia-eliminar">
                        <h2>¿Está seguro de eliminar esta actividad?</h2>
                        <p>Esta acción eliminará la actividad de la agenda institucional.</p>
                    </div>

                    <div class="detalles-cuadricula">

                        <div class="detalle-item">
                            <div class="detalle-etiqueta">ID</div>
                            <div class="detalle-valor"
                                 th:text="${actividad.idActividad}">
                                1
                            </div>
                        </div>

                        <div class="detalle-item">
                            <div class="detalle-etiqueta">Tipo</div>
                            <div class="detalle-valor"
                                 th:text="${actividad.tipo}">
                                INSTITUCIONAL
                            </div>
                        </div>

                        <div class="detalle-item ancho-completo">
                            <div class="detalle-etiqueta">Actividad</div>
                            <div class="detalle-valor"
                                 th:text="${actividad.nombre}">
                                Actividad
                            </div>
                        </div>

                        <div class="detalle-item">
                            <div class="detalle-etiqueta">Fecha</div>
                            <div class="detalle-valor"
                                 th:text="${#temporals.format(
                                 actividad.fecha,
                                 'dd/MM/yyyy'
                                 )}">
                                01/01/2026
                            </div>
                        </div>

                        <div class="detalle-item">
                            <div class="detalle-etiqueta">Horario</div>
                            <div class="detalle-valor"
                                 th:text="${actividad.horario != null
                                 && !actividad.horario.isBlank()
                                 ? actividad.horario
                                 : 'Sin especificar'}">
                                Horario
                            </div>
                        </div>

                    </div>

                    <form method="post"
                          th:action="@{/agenda/eliminar/{id}
                          (id=${actividad.idActividad})}">

                        <div class="acciones-formulario">

                            <a class="boton-secundario"
                               href="/agenda"
                               th:href="@{/agenda}">
                                Cancelar
                            </a>

                            <button class="boton-confirmar" type="submit">
                                Confirmar y Eliminar
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </main>

    </section>

</div>

</body>
</html>
