<!DOCTYPE html>

<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Actualizar espacio</title>

    <link rel="stylesheet"
          href="/css/estilos.css"
          th:href="@{/css/estilos.css}">

</head>

<body>

<div class="aplicacion">

    <aside th:replace="~{fragmentos/plantilla :: barra-lateral('espacios')}"></aside>

    <section class="area-principal">

        <header th:replace="~{fragmentos/plantilla :: barra-superior}"></header>

        <main class="contenido">

            <div class="formulario-tarjeta">

                <div class="tarjeta-encabezado">

                    <h1>Actualizar espacio</h1>

                    <p>
                        Modifique los datos del espacio seleccionado.
                    </p>

                </div>

                <div class="tarjeta-cuerpo">

                    <form method="post"
                          action="#"
                          th:action="@{/espacios/actualizar/{id}(id=${espacio.idEspacio})}"
                          th:object="${espacio}">

                        <input type="hidden"
                               th:field="*{idEspacio}">

                        <div class="formulario-cuadricula">

                            <div class="grupo-formulario ancho-completo">

                                <label for="nombre">
                                    Nombre del espacio *
                                </label>

                                <input class="campo-formulario"
                                       id="nombre"
                                       type="text"
                                       maxlength="150"
                                       placeholder="Ej. Sala de Conferencias A"
                                       th:field="*{nombre}"
                                       th:classappend="${#fields.hasErrors('nombre')} ? 'invalido' : ''">

                                <span class="texto-error"
                                      th:if="${#fields.hasErrors('nombre')}"
                                      th:errors="*{nombre}">
                                </span>

                            </div>

                            <div class="grupo-formulario">

                                <label for="capacidad">
                                    Capacidad de personas *
                                </label>

                                <input class="campo-formulario"
                                       id="capacidad"
                                       type="number"
                                       min="1"
                                       placeholder="Ej. 50"
                                       th:field="*{capacidad}"
                                       th:classappend="${#fields.hasErrors('capacidad')} ? 'invalido' : ''">

                                <span class="texto-error"
                                      th:if="${#fields.hasErrors('capacidad')}"
                                      th:errors="*{capacidad}">
                                </span>

                            </div>

                            <div class="grupo-formulario">

                                <label for="costoHora">
                                    Costo por hora (USD) *
                                </label>

                                <input class="campo-formulario"
                                       id="costoHora"
                                       type="number"
                                       step="0.01"
                                       min="0"
                                       placeholder="0.00"
                                       th:field="*{costoHora}"
                                       th:classappend="${#fields.hasErrors('costoHora')} ? 'invalido' : ''">

                                <span class="texto-error"
                                      th:if="${#fields.hasErrors('costoHora')}"
                                      th:errors="*{costoHora}">
                                </span>

                            </div>

                            <div class="grupo-formulario ancho-completo">

                                <label for="ubicacion">
                                    Ubicación
                                </label>

                                <input class="campo-formulario"
                                       id="ubicacion"
                                       type="text"
                                       maxlength="255"
                                       placeholder="Ej. Edificio principal, planta 2"
                                       th:field="*{ubicacion}"
                                       th:classappend="${#fields.hasErrors('ubicacion')} ? 'invalido' : ''">

                                <span class="texto-error"
                                      th:if="${#fields.hasErrors('ubicacion')}"
                                      th:errors="*{ubicacion}">
                                </span>

                            </div>

                            <div class="grupo-formulario ancho-completo">

                                <label for="descripcion">
                                    Descripción
                                </label>

                                <textarea class="campo-formulario"
                                          id="descripcion"
                                          maxlength="500"
                                          placeholder="Describa las características del espacio"
                                          th:field="*{descripcion}"
                                          th:classappend="${#fields.hasErrors('descripcion')} ? 'invalido' : ''">
                                </textarea>

                                <span class="texto-error"
                                      th:if="${#fields.hasErrors('descripcion')}"
                                      th:errors="*{descripcion}">
                                </span>

                            </div>

                            <div class="grupo-formulario ancho-completo">

                                <label for="estado">
                                    Estado *
                                </label>

                                <select class="campo-formulario"
                                        id="estado"
                                        th:field="*{estado}"
                                        th:classappend="${#fields.hasErrors('estado')} ? 'invalido' : ''">

                                    <option value="">
                                        Seleccione un estado
                                    </option>

                                    <option value="DISPONIBLE">
                                        Disponible
                                    </option>

                                    <option value="OCUPADO">
                                        Ocupado
                                    </option>

                                    <option value="MANTENIMIENTO">
                                        En mantenimiento
                                    </option>

                                </select>

                                <span class="texto-error"
                                      th:if="${#fields.hasErrors('estado')}"
                                      th:errors="*{estado}">
                                </span>

                            </div>

                        </div>

                        <div class="acciones-formulario">

                            <a class="boton-secundario"
                               href="/espacios"
                               th:href="@{/espacios}">
                                Cancelar
                            </a>

                            <button class="boton-guardar"
                                    type="submit">
                                Actualizar espacio
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </main>

    </section>

</div>

</body>

</html>
