<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catering — CFC UCA</title>
    <link rel="stylesheet" th:href="@{/css/cliente.css}" href="/css/cliente.css">
</head>
<body class="portal">


<div th:replace="~{fragmentos/plantilla-cliente :: barra('catering')}"></div>
<div th:replace="~{fragmentos/plantilla-cliente :: aviso-perfil}"></div>


<main class="portal-principal">
    <div class="portal-contenedor">


        <div class="portal-encabezado">
            <h1>Catering</h1>
            <p>Servicios de alimentación para tus eventos. El precio es por persona.</p>
        </div>


        <div class="tarjeta vacio" th:if="${#lists.isEmpty(servicios)}">
            No hay servicios de catering publicados por el momento.
        </div>


        <div class="catalogo-cuadricula" th:unless="${#lists.isEmpty(servicios)}">
            <article class="catalogo-tarjeta" th:each="servicio : ${servicios}"
                     th:with="disponible=${@formatoPortal.cateringDisponible(servicio)}">
                <div class="catalogo-tarjeta-cabecera">
                    <h3 th:text="${servicio.nombre}">Coffee Break</h3>
                    <span th:class="${@formatoPortal.claseEstado(servicio.estado)}"
                          th:text="${@formatoPortal.estado(servicio.estado)}">Disponible</span>
                </div>
                <p th:text="${servicio.descripcion ?: 'Sin descripción.'}">Descripción</p>
                <dl class="datos-lista">
                    <div><dt>Precio por persona</dt><dd th:text="${@formatoPortal.dinero(servicio.precioPorPersona)}">$10.00</dd></div>
                    <div><dt>Asistentes</dt><dd th:text="${servicio.capacidadMinima} + ' a ' + ${servicio.capacidadMaxima} + ' personas'">20 a 150 personas</dd></div>
                </dl>
                <a th:if="${disponible}"
                   class="boton-primario"
                   th:href="@{/mi-cuenta/catering/solicitar(servicio=${servicio.idCatering})}">Solicitar</a>
                <button th:unless="${disponible}" class="boton-primario" type="button" disabled>No disponible</button>
            </article>
        </div>
    </div>
</main>


<footer th:replace="~{fragmentos/plantilla-cliente :: pie}"></footer>


</body>
</html>
