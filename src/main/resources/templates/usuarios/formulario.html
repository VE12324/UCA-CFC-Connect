<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Administrar Usuario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<h2 th:text="${usuario.id == null} ? 'Crear Usuario' : 'Editar Usuario'"></h2>

<form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post" class="mt-4">
    <input type="hidden" th:field="*{id}" />

    <div class="mb-3">
        <label class="form-label">Nombre Completo</label>
        <input type="text" th:field="*{nombre}" class="form-control" />
        <div class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
    </div>

    <div class="mb-3">
        <label class="form-label">Correo Electrónico</label>
        <input type="email" th:field="*{correo}" class="form-control" />
        <div class="text-danger" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
    </div>

    <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" th:field="*{password}" class="form-control" />
        <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
    </div>

    <!-- Selección dinámica del rol traído de la DB -->
    <div class="mb-3">
        <label class="form-label">Rol del Sistema</label>
        <select th:field="*{idRol}" class="form-select">
            <option value="">-- Seleccione un Rol --</option>
            <option th:each="r : ${roles}"
                    th:value="${r.idRol}"
                    th:text="${r.nombre}"></option>
        </select>
        <div class="text-danger" th:if="${#fields.hasErrors('idRol')}" th:errors="*{idRol}"></div>
    </div>

    <button type="submit" class="btn btn-primary">Guardar</button>
    <a th:href="@{/usuarios}" class="btn btn-secondary">Cancelar</a>
</form>
</body>
</html>
