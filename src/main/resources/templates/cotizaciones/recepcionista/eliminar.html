<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Eliminar Cotización</title>

    <link rel="stylesheet"
          href="/css/estilos.css"
          th:href="@{/css/estilos.css}">
</head>

<body>

<div class="aplicacion">

    <aside th:replace="~{fragmentos/plantilla :: barra-lateral('cotizaciones')}">
    </aside>

    <section class="area-principal">

        <header th:replace="~{fragmentos/plantilla :: barra-superior}">
        </header>

        <main class="contenido">

            <div class="eliminar-tarjeta">

                <div class="tarjeta-encabezado">

                    <h1>Eliminar Cotización</h1>

                    <p>
                        Confirme la eliminación de la cotización.
                    </p>

                </div>

                <div class="tarjeta-cuerpo">

                    <div class="advertencia-eliminar">

                        <h2>
                            ¿Está seguro de eliminar esta cotización?
                        </h2>

                        <p>
                            También se eliminarán todos sus detalles.
                            Si existen pagos asociados, la cotización no podrá eliminarse.
                        </p>

                    </div>

                    <div class="detalles-cuadricula">

                        <div class="detalle-item">

                            <div class="detalle-etiqueta">
                                ID
                            </div>

                            <div class="detalle-valor"
                                 th:text="${cotizacion.idCotizacion}">

                                1

                            </div>

                        </div>

                        <div class="detalle-item">

                            <div class="detalle-etiqueta">
                                Fecha
                            </div>

                            <div class="detalle-valor"
                                 th:text="${#temporals.format(
                                 cotizacion.fecha,
                                 'dd/MM/yyyy')}">

                                01/01/2026

                            </div>

                        </div>

                        <div class="detalle-item ancho-completo">

                            <div class="detalle-etiqueta">
                                Cliente
                            </div>

                            <div class="detalle-valor"
                                 th:text="${cotizacion.nombreCliente}">

                                Cliente

                            </div>

                        </div>

                        <div class="detalle-item">

                            <div class="detalle-etiqueta">
                                Estado
                            </div>

                            <div class="detalle-valor"
                                 th:text="${cotizacion.estado}">

                                Pendiente

                            </div>

                        </div>

                        <div class="detalle-item">

                            <div class="detalle-etiqueta">
                                Total
                            </div>

                            <div class="detalle-valor"
                                 th:text="${'$'
                                 + #numbers.formatDecimal(
                                 cotizacion.total,
                                 1,
                                 2)}">

                                $0.00

                            </div>

                        </div>

                    </div>

                    <form method="post"
                          th:action="@{/cotizaciones/eliminar/{id}
                          (id=${cotizacion.idCotizacion})}">

                        <div class="acciones-formulario">

                            <a class="boton-secundario"
                               href="/cotizaciones"
                               th:href="@{/cotizaciones}">

                                Cancelar

                            </a>

                            <button class="boton-confirmar"
                                    type="submit">

                                Confirmar y Eliminar

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </main>

    </section>

</div>

</body>
</html>
