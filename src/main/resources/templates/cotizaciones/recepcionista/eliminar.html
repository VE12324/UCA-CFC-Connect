<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Eliminar cotización</title>

    <link rel="stylesheet"
          href="/css/estilos.css"
          data-th-href="@{/css/estilos.css}">
</head>

<body>

<div class="aplicacion">

    <aside data-th-replace=
           "~{fragmentos/plantilla :: barra-lateral('cotizaciones')}">
    </aside>

    <main class="area-principal">

        <header data-th-replace=
                "~{fragmentos/plantilla :: barra-superior}">
        </header>

        <section class="contenido">

            <div class="formulario-tarjeta">

                <div class="tarjeta-encabezado">
                    <h1>Eliminar cotización</h1>

                    <p>
                        Esta acción eliminará la cotización
                        y todos sus detalles.
                    </p>
                </div>

                <div class="tarjeta-cuerpo">

                    <div class="formulario-cuadricula">

                        <div class="grupo-formulario">
                            <label>Cliente</label>

                            <p class="campo-formulario"
                               data-th-text="${cotizacion.nombreCliente}">
                                Cliente
                            </p>
                        </div>

                        <div class="grupo-formulario">
                            <label>Fecha</label>

                            <p class="campo-formulario"
                               data-th-text="${#temporals.format(cotizacion.fecha, 'dd/MM/yyyy')}">
                                Fecha
                            </p>
                        </div>

                        <div class="grupo-formulario">
                            <label>Estado</label>

                            <p class="campo-formulario"
                               data-th-text="${cotizacion.estado}">
                                Estado
                            </p>
                        </div>

                        <div class="grupo-formulario">
                            <label>Total</label>

                            <p class="campo-formulario"
                               data-th-text="${'$ ' + #numbers.formatDecimal(cotizacion.total, 1, 2)}">
                                $ 0.00
                            </p>
                        </div>

                    </div>

                    <div class="acciones-formulario">

                        <a class="boton-secundario"
                           data-th-href="@{/cotizaciones}">
                            Cancelar
                        </a>

                        <form method="post"
                              data-th-action="@{/cotizaciones/eliminar/{id}(id=${cotizacion.idCotizacion})}">

                            <button class="boton-eliminar"
                                    type="submit">
                                Confirmar eliminación
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </section>

    </main>

</div>

</body>
</html>
