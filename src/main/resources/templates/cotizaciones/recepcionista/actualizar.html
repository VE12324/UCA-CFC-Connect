<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Actualizar Cotización</title>

    <link rel="stylesheet"
          href="/css/estilos.css"
          th:href="@{/css/estilos.css}">
</head>

<body>

<div class="aplicacion">

    <aside th:replace="~{fragmentos/plantilla :: barra-lateral('cotizaciones')}">
    </aside>

    <section class="area-principal">

        <header th:replace="~{fragmentos/plantilla :: barra-superior}">
        </header>

        <main class="contenido">

            <div class="formulario-tarjeta">

                <div class="tarjeta-encabezado">

                    <h1>Actualizar Cotización</h1>

                    <p>
                        Modifique los datos y detalles de la cotización.
                    </p>

                </div>

                <div class="tarjeta-cuerpo">

                    <form method="post"
                          th:action="@{/cotizaciones/actualizar/{id}
                          (id=${idCotizacion})}"
                          th:object="${cotizacion}">

                        <div class="mensaje mensaje-error"
                             th:if="${#fields.hasGlobalErrors()}">

                            <div th:each="error : ${#fields.globalErrors()}"
                                 th:text="${error}">
                                Error
                            </div>

                        </div>

                        <div class="formulario-cuadricula">

                            <div class="grupo-formulario">

                                <label for="fecha">
                                    Fecha *
                                </label>

                                <input class="campo-formulario"
                                       id="fecha"
                                       name="fecha"
                                       type="date"
                                       required
                                       th:value="${cotizacion.fecha != null
                                       ? #temporals.format(
                                       cotizacion.fecha,
                                       'yyyy-MM-dd')
                                       : ''}">

                                <span class="texto-error"
                                      th:if="${#fields.hasErrors('fecha')}"
                                      th:errors="*{fecha}">
                                </span>

                            </div>

                            <div class="grupo-formulario">

                                <label for="cliente">
                                    Cliente *
                                </label>

                                <select class="campo-formulario"
                                        id="cliente"
                                        name="idCliente"
                                        required>

                                    <option value="">
                                        Seleccione un cliente
                                    </option>

                                    <option th:each="cliente : ${clientes}"
                                            th:value="${cliente.idCliente}"
                                            th:selected="${cotizacion.idCliente != null
                                            and cotizacion.idCliente
                                            == cliente.idCliente}"
                                            th:text="${cliente.nombre
                                            + (cliente.dui != null
                                            and !cliente.dui.isBlank()
                                            ? ' — DUI: ' + cliente.dui
                                            : '')}">
                                        Cliente
                                    </option>

                                </select>

                                <span class="texto-error"
                                      th:if="${#fields.hasErrors('idCliente')}"
                                      th:errors="*{idCliente}">
                                </span>

                            </div>

                        </div>

                        <div style="margin-top:25px;">

                            <div style="display:flex;
                                        justify-content:space-between;
                                        align-items:center;
                                        margin-bottom:15px;">

                                <div>

                                    <h2>Detalles de la cotización</h2>

                                    <p>
                                        Modifique, agregue o elimine detalles.
                                    </p>

                                </div>

                                <button type="button"
                                        class="boton-nuevo"
                                        onclick="agregarDetalle()">

                                    ＋ Agregar detalle

                                </button>

                            </div>

                            <div class="tabla-contenedor">

                                <table class="tabla-datos">

                                    <thead>

                                    <tr>
                                        <th>Descripción</th>
                                        <th>Cantidad</th>
                                        <th>Precio</th>
                                        <th>Subtotal</th>
                                        <th>Acción</th>
                                    </tr>

                                    </thead>

                                    <tbody id="cuerpoDetalles">

                                    <tr th:each="detalle, iterador
                                        : ${cotizacion.detalles}">

                                        <td>

                                            <input class="campo-formulario descripcion"
                                                   type="text"
                                                   maxlength="255"
                                                   required
                                                   th:name="|detalles[${iterador.index}].descripcion|"
                                                   th:value="${detalle.descripcion}">

                                        </td>

                                        <td>

                                            <input class="campo-formulario cantidad"
                                                   type="number"
                                                   min="1"
                                                   required
                                                   th:name="|detalles[${iterador.index}].cantidad|"
                                                   th:value="${detalle.cantidad}"
                                                   oninput="calcularFila(this)">

                                        </td>

                                        <td>

                                            <input class="campo-formulario precio"
                                                   type="number"
                                                   min="0.01"
                                                   step="0.01"
                                                   required
                                                   th:name="|detalles[${iterador.index}].precio|"
                                                   th:value="${detalle.precio}"
                                                   oninput="calcularFila(this)">

                                        </td>

                                        <td class="subtotal-fila">
                                            $0.00
                                        </td>

                                        <td>

                                            <button type="button"
                                                    class="boton-accion boton-eliminar"
                                                    onclick="eliminarDetalle(this)">

                                                Quitar

                                            </button>

                                        </td>

                                    </tr>

                                    <tr th:if="${cotizacion.detalles == null
                                    or cotizacion.detalles.isEmpty()}">

                                        <td>

                                            <input class="campo-formulario descripcion"
                                                   type="text"
                                                   maxlength="255"
                                                   required
                                                   placeholder="Descripción"
                                                   name="detalles[0].descripcion">

                                        </td>

                                        <td>

                                            <input class="campo-formulario cantidad"
                                                   type="number"
                                                   min="1"
                                                   value="1"
                                                   required
                                                   name="detalles[0].cantidad"
                                                   oninput="calcularFila(this)">

                                        </td>

                                        <td>

                                            <input class="campo-formulario precio"
                                                   type="number"
                                                   min="0.01"
                                                   step="0.01"
                                                   required
                                                   placeholder="0.00"
                                                   name="detalles[0].precio"
                                                   oninput="calcularFila(this)">

                                        </td>

                                        <td class="subtotal-fila">
                                            $0.00
                                        </td>

                                        <td>

                                            <button type="button"
                                                    class="boton-accion boton-eliminar"
                                                    onclick="eliminarDetalle(this)">

                                                Quitar

                                            </button>

                                        </td>

                                    </tr>

                                    </tbody>

                                </table>

                            </div>

                        </div>

                        <div class="acciones-formulario">

                            <a class="boton-secundario"
                               href="/cotizaciones"
                               th:href="@{/cotizaciones}">

                                Cancelar

                            </a>

                            <button class="boton-guardar"
                                    type="submit">

                                Actualizar Cotización

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </main>

    </section>

</div>

<script>
    function agregarDetalle() {

        const cuerpo =
            document.getElementById("cuerpoDetalles");

        const indice =
            cuerpo.querySelectorAll("tr").length;

        const fila =
            document.createElement("tr");

        fila.innerHTML =
            '<td>' +
                '<input class="campo-formulario descripcion" ' +
                'type="text" maxlength="255" required ' +
                'placeholder="Descripción" ' +
                'name="detalles[' + indice + '].descripcion">' +
            '</td>' +

            '<td>' +
                '<input class="campo-formulario cantidad" ' +
                'type="number" min="1" value="1" required ' +
                'name="detalles[' + indice + '].cantidad" ' +
                'oninput="calcularFila(this)">' +
            '</td>' +

            '<td>' +
                '<input class="campo-formulario precio" ' +
                'type="number" min="0.01" step="0.01" required ' +
                'placeholder="0.00" ' +
                'name="detalles[' + indice + '].precio" ' +
                'oninput="calcularFila(this)">' +
            '</td>' +

            '<td class="subtotal-fila">$0.00</td>' +

            '<td>' +
                '<button type="button" ' +
                'class="boton-accion boton-eliminar" ' +
                'onclick="eliminarDetalle(this)">' +
                    'Quitar' +
                '</button>' +
            '</td>';

        cuerpo.appendChild(fila);
    }

    function eliminarDetalle(boton) {

        const cuerpo =
            document.getElementById("cuerpoDetalles");

        if (cuerpo.querySelectorAll("tr").length <= 1) {

            alert(
                "La cotización debe tener al menos un detalle."
            );

            return;
        }

        boton.closest("tr").remove();

        renumerarDetalles();
    }

    function renumerarDetalles() {

        document.querySelectorAll("#cuerpoDetalles tr")
            .forEach(function (fila, indice) {

                fila.querySelector(".descripcion").name =
                    "detalles[" + indice + "].descripcion";

                fila.querySelector(".cantidad").name =
                    "detalles[" + indice + "].cantidad";

                fila.querySelector(".precio").name =
                    "detalles[" + indice + "].precio";
            });
    }

    function calcularFila(campo) {

        const fila =
            campo.closest("tr");

        const cantidad =
            parseFloat(
                fila.querySelector(".cantidad").value
            ) || 0;

        const precio =
            parseFloat(
                fila.querySelector(".precio").value
            ) || 0;

        fila.querySelector(".subtotal-fila").textContent =
            "$" + (cantidad * precio).toFixed(2);
    }

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            document.querySelectorAll("#cuerpoDetalles tr")
                .forEach(function (fila) {

                    const cantidad =
                        fila.querySelector(".cantidad");

                    if (cantidad) {
                        calcularFila(cantidad);
                    }
                });
        }
    );
</script>

</body>
</html>
