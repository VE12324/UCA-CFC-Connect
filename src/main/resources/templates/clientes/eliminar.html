<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Eliminar cliente</title>

    <link rel="stylesheet"
          href="/css/estilos.css"
          data-th-href="@{/css/estilos.css}">
</head>

<body>

<div class="aplicacion">

    <aside th:replace="~{fragmentos/plantilla :: barra-lateral('clientes')}"></aside>

    <main class="area-principal">

        <header th:replace="~{fragmentos/plantilla :: barra-superior}"></header>

        <section class="contenido">

            <div class="eliminar-tarjeta">

                <div class="tarjeta-encabezado">
                    <h1>Eliminar cliente</h1>
                    <p>Confirme la eliminación del cliente seleccionado.</p>
                </div>

                <div class="tarjeta-cuerpo">

                    <div class="advertencia-eliminar">

                        <h2>¿Está seguro de eliminar este cliente?</h2>

                        <p>
                            Esta acción eliminará permanentemente la
                            información del cliente y no podrá deshacerse.
                        </p>

                    </div>

                    <div class="detalles-cuadricula">

                        <div class="detalle-item">
                            <p class="detalle-etiqueta">Código</p>

                            <p class="detalle-valor"
                               data-th-text="${cliente.idCliente}">
                                1
                            </p>
                        </div>

                        <div class="detalle-item">
                            <p class="detalle-etiqueta">DUI o NIT</p>

                            <p class="detalle-valor"
                               data-th-text="${cliente.dui}">
                                00000000-0
                            </p>
                        </div>

                        <div class="detalle-item">
                            <p class="detalle-etiqueta">Nombre</p>

                            <p class="detalle-valor"
                               data-th-text="${cliente.nombre}">
                                Nombre del cliente
                            </p>
                        </div>

                        <div class="detalle-item">
                            <p class="detalle-etiqueta">Empresa</p>

                            <p class="detalle-valor"
                               data-th-text="${#strings.isEmpty(cliente.empresa) ? 'No registrada' : cliente.empresa}">
                                Empresa
                            </p>
                        </div>

                    </div>

                    <form method="post"
                          data-th-action="@{/clientes/eliminar/{id}(id=${cliente.idCliente})}">

                        <div class="acciones-formulario">

                            <a class="boton-secundario"
                               href="/clientes"
                               data-th-href="@{/clientes}">
                                Cancelar
                            </a>

                            <button class="boton-confirmar"
                                    type="submit">
                                Eliminar cliente
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </section>

    </main>

</div>

</body>
</html>
