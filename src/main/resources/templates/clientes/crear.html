<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registrar cliente</title>

    <link rel="stylesheet"
          href="/css/estilos.css"
          data-th-href="@{/css/estilos.css}">
</head>

<body>

<div class="aplicacion">

    <aside th:replace="~{fragmentos/plantilla :: barra-lateral('clientes')}"></aside>

    <main class="area-principal">

        <header th:replace="~{fragmentos/plantilla :: barra-superior}"></header>

        <section class="contenido">

            <div class="formulario-tarjeta">

                <div class="tarjeta-encabezado">

                    <h1>Registrar cliente</h1>

                    <p>
                        Complete la información del nuevo cliente.
                    </p>

                </div>

                <div class="tarjeta-cuerpo">

                    <form method="post"
                          action="/clientes/crear"
                          data-th-action="@{/clientes/crear}"
                          data-th-object="${cliente}">

                        <div class="formulario-cuadricula">

                            <div class="grupo-formulario">

                                <label for="dui">
                                    DUI o NIT
                                </label>

                                <input class="campo-formulario"
                                       type="text"
                                       id="dui"
                                       maxlength="20"
                                       placeholder="00000000-0"
                                       data-th-field="*{dui}">

                                <span class="texto-error"
                                      data-th-if="${#fields.hasErrors('dui')}"
                                      data-th-errors="*{dui}">
                                </span>

                            </div>

                            <div class="grupo-formulario">

                                <label for="nombre">
                                    Nombre
                                </label>

                                <input class="campo-formulario"
                                       type="text"
                                       id="nombre"
                                       maxlength="150"
                                       placeholder="Nombre del cliente"
                                       data-th-field="*{nombre}"
                                       required>

                                <span class="texto-error"
                                      data-th-if="${#fields.hasErrors('nombre')}"
                                      data-th-errors="*{nombre}">
                                </span>

                            </div>

                            <div class="grupo-formulario">

                                <label for="empresa">
                                    Empresa
                                </label>

                                <input class="campo-formulario"
                                       type="text"
                                       id="empresa"
                                       maxlength="150"
                                       placeholder="Nombre de la empresa"
                                       data-th-field="*{empresa}">

                                <span class="texto-error"
                                      data-th-if="${#fields.hasErrors('empresa')}"
                                      data-th-errors="*{empresa}">
                                </span>

                            </div>

                            <div class="grupo-formulario">

                                <label for="correo">
                                    Correo electrónico
                                </label>

                                <input class="campo-formulario"
                                       type="email"
                                       id="correo"
                                       maxlength="150"
                                       placeholder="cliente@correo.com"
                                       data-th-field="*{correo}">

                                <span class="texto-error"
                                      data-th-if="${#fields.hasErrors('correo')}"
                                      data-th-errors="*{correo}">
                                </span>

                            </div>

                            <div class="grupo-formulario">

                                <label for="telefono">
                                    Teléfono
                                </label>

                                <input class="campo-formulario"
                                       type="text"
                                       id="telefono"
                                       maxlength="30"
                                       placeholder="+503 0000-0000"
                                       data-th-field="*{telefono}">

                                <span class="texto-error"
                                      data-th-if="${#fields.hasErrors('telefono')}"
                                      data-th-errors="*{telefono}">
                                </span>

                            </div>

                            <div class="grupo-formulario ancho-completo">

                                <label for="direccion">
                                    Dirección
                                </label>

                                <textarea class="campo-formulario"
                                          id="direccion"
                                          maxlength="255"
                                          placeholder="Dirección del cliente"
                                          data-th-field="*{direccion}"></textarea>

                                <span class="texto-error"
                                      data-th-if="${#fields.hasErrors('direccion')}"
                                      data-th-errors="*{direccion}">
                                </span>

                            </div>

                        </div>

                        <div class="acciones-formulario">

                            <a class="boton-secundario"
                               href="/clientes"
                               data-th-href="@{/clientes}">
                                Cancelar
                            </a>

                            <button class="boton-guardar"
                                    type="submit">
                                Guardar cliente
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </section>

    </main>

</div>

</body>
</html>
