<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Crear cliente</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand"
               href="/clientes"
               data-th-href="@{/clientes}">
                UCA-CFC Connect
            </a>

            <div class="navbar-nav">

                <a class="nav-link active"
                   href="/clientes"
                   data-th-href="@{/clientes}">
                    Clientes
                </a>

                <a class="nav-link"
                   href="/participantes"
                   data-th-href="@{/participantes}">
                    Participantes
                </a>

            </div>

        </div>

    </nav>

    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card shadow-sm">

                    <div class="card-header bg-dark text-white">

                        <h1 class="h4 mb-0">
                            Crear cliente
                        </h1>

                    </div>

                    <div class="card-body p-4">

                        <form method="post"
                              action="/clientes/crear"
                              data-th-action="@{/clientes/crear}"
                              data-th-object="${cliente}"
                              novalidate>

                            <div class="row g-3">

                                <div class="col-md-6">

                                    <label for="dui"
                                           class="form-label">
                                        DUI o NIT
                                    </label>

                                    <input type="text"
                                           id="dui"
                                           class="form-control"
                                           data-th-classappend="${#fields.hasErrors('dui')} ? 'is-invalid' : ''"
                                           data-th-field="*{dui}"
                                           placeholder="00000000-0">

                                    <div class="invalid-feedback"
                                         data-th-errors="*{dui}">
                                    </div>

                                </div>

                                <div class="col-md-6">

                                    <label for="nombre"
                                           class="form-label">
                                        Nombre
                                    </label>

                                    <input type="text"
                                           id="nombre"
                                           class="form-control"
                                           data-th-classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''"
                                           data-th-field="*{nombre}"
                                           placeholder="Nombre del cliente"
                                           required>

                                    <div class="invalid-feedback"
                                         data-th-errors="*{nombre}">
                                    </div>

                                </div>

                                <div class="col-md-6">

                                    <label for="empresa"
                                           class="form-label">
                                        Empresa
                                    </label>

                                    <input type="text"
                                           id="empresa"
                                           class="form-control"
                                           data-th-classappend="${#fields.hasErrors('empresa')} ? 'is-invalid' : ''"
                                           data-th-field="*{empresa}"
                                           placeholder="Nombre de la empresa">

                                    <div class="invalid-feedback"
                                         data-th-errors="*{empresa}">
                                    </div>

                                </div>

                                <div class="col-md-6">

                                    <label for="correo"
                                           class="form-label">
                                        Correo electrónico
                                    </label>

                                    <input type="email"
                                           id="correo"
                                           class="form-control"
                                           data-th-classappend="${#fields.hasErrors('correo')} ? 'is-invalid' : ''"
                                           data-th-field="*{correo}"
                                           placeholder="cliente@correo.com">

                                    <div class="invalid-feedback"
                                         data-th-errors="*{correo}">
                                    </div>

                                </div>

                                <div class="col-md-6">

                                    <label for="telefono"
                                           class="form-label">
                                        Teléfono
                                    </label>

                                    <input type="text"
                                           id="telefono"
                                           class="form-control"
                                           data-th-classappend="${#fields.hasErrors('telefono')} ? 'is-invalid' : ''"
                                           data-th-field="*{telefono}"
                                           placeholder="7000-0000">

                                    <div class="invalid-feedback"
                                         data-th-errors="*{telefono}">
                                    </div>

                                </div>

                                <div class="col-md-6">

                                    <label for="direccion"
                                           class="form-label">
                                        Dirección
                                    </label>

                                    <input type="text"
                                           id="direccion"
                                           class="form-control"
                                           data-th-classappend="${#fields.hasErrors('direccion')} ? 'is-invalid' : ''"
                                           data-th-field="*{direccion}"
                                           placeholder="Dirección del cliente">

                                    <div class="invalid-feedback"
                                         data-th-errors="*{direccion}">
                                    </div>

                                </div>

                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-4">

                                <a class="btn btn-secondary"
                                   href="/clientes"
                                   data-th-href="@{/clientes}">
                                    Cancelar
                                </a>

                                <button type="submit"
                                        class="btn btn-primary">
                                    Registrar cliente
                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </main>

</body>

</html>
