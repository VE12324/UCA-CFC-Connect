<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registrar cliente</title>

    <link rel="stylesheet"
          href="/css/estilos.css"
          data-th-href="@{/css/estilos.css}">
</head>

<body>

<div class="aplicacion">

    <aside data-th-replace="~{fragmentos/plantilla :: barra-lateral('clientes')}"></aside>

    <main class="area-principal">

        <header data-th-replace="~{fragmentos/plantilla :: barra-superior}"></header>

        <section class="contenido">

            <div class="formulario-tarjeta">

                <div class="tarjeta-encabezado">

                    <h1>Registrar cliente</h1>

                    <p>
                        Complete la información del nuevo cliente.
                    </p>

                </div>

                <div class="tarjeta-cuerpo">

                    <form method="post"
                          action="/clientes/crear"
                          data-th-action="@{/clientes/crear}"
                          data-th-object="${cliente}">

                        <div class="formulario-cuadricula">

                            <div class="grupo-formulario">

                                <label for="dui">
                                    DUI o NIT
                                </label>

                                <input class="campo-formulario"
                                       type="text"
                                       id="dui"
                                       maxlength="20"
                                       placeholder="00000000-0"
                                       data-th-field="*{dui}">

                                <span class="texto-error"
                                      data-th-if="${#fields.hasErrors('dui')}"
                                      data-th-errors="*{dui}">
                                </span>

                            </div>

                            <div class="grupo-formulario">

                                <label for="nombre">
                                    Nombre
                                </label>

                                <input class="campo-formulario"
                                       type="text"
                                       id="nombre"
                                       maxlength="150"
                                       placeholder="Nombre del cliente"
                                       data-th-field="*{nombre}"
                                       required>

                                <span class="texto-error"
                                      data-th-if="${#fields.hasErrors('nombre')}"
                                      data-th-errors="*{nombre}">
                                </span>

                            </div>

                            <div class="grupo-formulario">

                                <label for="empresa">
                                    Empresa
                                </label>

                                <input class="campo-formulario"
                                       type="text"
                                       id="empresa"
                                       maxlength="150"
                                       placeholder="Nombre de la empresa"
                                       data-th-field="*{empresa}">

                                <span class="texto-error"
                                      data-th-if="${#fields.hasErrors('empresa')}"
                                      data-th-errors="*{empresa}">
                                </span>

                            </div>

                            <div class="grupo-formulario">

                                <label for="correo">
                                    Correo electrónico
                                </label>

                                <input class="campo-formulario"
                                       type="email"
                                       id="correo"
                                       maxlength="150"
                                       placeholder="cliente@correo.com"
                                       data-th-field="*{correo}">

                                <span class="texto-error"
                                      data-th-if="${#fields.hasErrors('correo')}"
                                      data-th-errors="*{correo}">
                                </span>

                            </div>

                            <div class="grupo-formulario">

                                <label for="telefono">
                                    Teléfono
                                </label>

                                <input class="campo-formulario"
                                       type="text"
                                       id="telefono"
                                       maxlength="30"
                                       placeholder="+503 0000-0000"
                                       data-th-field="*{telefono}">

                                <span class="texto-error"
                                      data-th-if="${#fields.hasErrors('telefono')}"
                                      data-th-errors="*{telefono}">
                                </span>

                            </div>

                            <div class="grupo-formulario ancho-completo">

                                <label for="direccion">
                                    Dirección
                                </label>

                                <textarea class="campo-formulario"
                                          id="direccion"
                                          maxlength="255"
                                          placeholder="Dirección del cliente"
                                          data-th-field="*{direccion}"></textarea>

                                <span class="texto-error"
                                      data-th-if="${#fields.hasErrors('direccion')}"
                                      data-th-errors="*{direccion}">
                                </span>

                            </div>

                            <!-- Creación opcional de cuenta -->

                            <div class="grupo-formulario ancho-completo">

                                <label style="display:flex;
                                              align-items:center;
                                              gap:10px;
                                              cursor:pointer;">

                                    <input type="checkbox"
                                           id="crearCuenta"
                                           data-th-field="*{crearCuenta}">

                                    <span>
                                        Crear una cuenta de acceso para este cliente
                                    </span>

                                </label>

                                <small>
                                    El cliente utilizará su correo electrónico y
                                    contraseña para ingresar al sistema.
                                </small>

                            </div>

                            <div id="datosCuenta"
                                 class="ancho-completo"
                                 style="display:none;">

                                <div class="formulario-cuadricula">

                                    <div class="grupo-formulario">

                                        <label for="password">
                                            Contraseña
                                        </label>

                                        <input class="campo-formulario"
                                               type="password"
                                               id="password"
                                               autocomplete="new-password"
                                               placeholder="Ingrese la contraseña"
                                               data-th-field="*{password}">

                                        <small>
                                            Mínimo 8 caracteres, con mayúscula,
                                            minúscula, número y carácter especial.
                                        </small>

                                        <span class="texto-error"
                                              data-th-if="${#fields.hasErrors('password')}"
                                              data-th-errors="*{password}">
                                        </span>

                                    </div>

                                    <div class="grupo-formulario">

                                        <label for="confirmarPassword">
                                            Confirmar contraseña
                                        </label>

                                        <input class="campo-formulario"
                                               type="password"
                                               id="confirmarPassword"
                                               autocomplete="new-password"
                                               placeholder="Repita la contraseña"
                                               data-th-field="*{confirmarPassword}">

                                        <span class="texto-error"
                                              data-th-if="${#fields.hasErrors('confirmarPassword')}"
                                              data-th-errors="*{confirmarPassword}">
                                        </span>

                                    </div>

                                </div>

                            </div>

                        </div>

                        <div class="acciones-formulario">

                            <a class="boton-secundario"
                               href="/clientes"
                               data-th-href="@{/clientes}">
                                Cancelar
                            </a>

                            <button class="boton-guardar"
                                    type="submit">
                                Guardar cliente
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </section>

    </main>

</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {

        const crearCuenta = document.getElementById("crearCuenta");
        const datosCuenta = document.getElementById("datosCuenta");
        const password = document.getElementById("password");
        const confirmarPassword =
                document.getElementById("confirmarPassword");

        function actualizarCamposCuenta() {

            const cuentaSeleccionada = crearCuenta.checked;

            datosCuenta.style.display =
                    cuentaSeleccionada ? "block" : "none";

            password.required = cuentaSeleccionada;
            confirmarPassword.required = cuentaSeleccionada;

            if (!cuentaSeleccionada) {
                password.value = "";
                confirmarPassword.value = "";
            }
        }

        crearCuenta.addEventListener(
                "change",
                actualizarCamposCuenta
        );

        actualizarCamposCuenta();
    });
</script>

</body>
</html>
