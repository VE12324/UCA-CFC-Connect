<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Consultar cliente</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand"
               href="/clientes"
               data-th-href="@{/clientes}">
                UCA-CFC Connect
            </a>

            <div class="navbar-nav">

                <a class="nav-link active"
                   href="/clientes"
                   data-th-href="@{/clientes}">
                    Clientes
                </a>

                <a class="nav-link"
                   href="/participantes"
                   data-th-href="@{/participantes}">
                    Participantes
                </a>

            </div>

        </div>

    </nav>

    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card shadow-sm">

                    <div class="card-header bg-dark text-white">

                        <h1 class="h4 mb-0">
                            Información del cliente
                        </h1>

                    </div>

                    <div class="card-body p-4">

                        <div class="row g-4">

                            <div class="col-md-6">

                                <p class="text-secondary mb-1">
                                    Identificador
                                </p>

                                <p class="fw-bold"
                                   data-th-text="${cliente.idCliente}">
                                    1
                                </p>

                            </div>

                            <div class="col-md-6">

                                <p class="text-secondary mb-1">
                                    DUI o NIT
                                </p>

                                <p class="fw-bold"
                                   data-th-text="${cliente.dui}">
                                    00000000-0
                                </p>

                            </div>

                            <div class="col-md-6">

                                <p class="text-secondary mb-1">
                                    Nombre
                                </p>

                                <p class="fw-bold"
                                   data-th-text="${cliente.nombre}">
                                    Nombre del cliente
                                </p>

                            </div>

                            <div class="col-md-6">

                                <p class="text-secondary mb-1">
                                    Empresa
                                </p>

                                <p class="fw-bold"
                                   data-th-text="${cliente.empresa}">
                                    Empresa
                                </p>

                            </div>

                            <div class="col-md-6">

                                <p class="text-secondary mb-1">
                                    Correo electrónico
                                </p>

                                <p class="fw-bold"
                                   data-th-text="${cliente.correo}">
                                    cliente@correo.com
                                </p>

                            </div>

                            <div class="col-md-6">

                                <p class="text-secondary mb-1">
                                    Teléfono
                                </p>

                                <p class="fw-bold"
                                   data-th-text="${cliente.telefono}">
                                    7000-0000
                                </p>

                            </div>

                            <div class="col-12">

                                <p class="text-secondary mb-1">
                                    Dirección
                                </p>

                                <p class="fw-bold"
                                   data-th-text="${cliente.direccion}">
                                    Dirección del cliente
                                </p>

                            </div>

                        </div>

                        <hr>

                        <div class="d-flex justify-content-end gap-2">

                            <a class="btn btn-secondary"
                               href="/clientes"
                               data-th-href="@{/clientes}">
                                Regresar
                            </a>

                            <a class="btn btn-warning"
                               href="#"
                               data-th-href="@{/clientes/actualizar/{id}(id=${cliente.idCliente})}">
                                Actualizar
                            </a>

                            <a class="btn btn-danger"
                               href="#"
                               data-th-href="@{/clientes/eliminar/{id}(id=${cliente.idCliente})}">
                                Eliminar
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

</body>

</html>
