<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Consultar cliente</title>

    <link rel="stylesheet"
          href="/css/estilos.css"
          data-th-href="@{/css/estilos.css}">
</head>

<body>

<div class="aplicacion">

    <aside th:replace="~{fragmentos/plantilla :: barra-lateral('clientes')}"></aside>

    <main class="area-principal">

        <header th:replace="~{fragmentos/plantilla :: barra-superior}"></header>

        <section class="contenido">

            <div class="detalle-tarjeta">

                <div class="tarjeta-encabezado">
                    <h1>Información del cliente</h1>
                    <p>Consulte los datos del cliente seleccionado.</p>
                </div>

                <div class="tarjeta-cuerpo">

                    <div class="detalles-cuadricula">

                        <div class="detalle-item">
                            <p class="detalle-etiqueta">Código</p>
                            <p class="detalle-valor"
                               data-th-text="${cliente.idCliente}">
                                1
                            </p>
                        </div>

                        <div class="detalle-item">
                            <p class="detalle-etiqueta">DUI o NIT</p>
                            <p class="detalle-valor"
                               data-th-text="${cliente.dui}">
                                00000000-0
                            </p>
                        </div>

                        <div class="detalle-item">
                            <p class="detalle-etiqueta">Nombre</p>
                            <p class="detalle-valor"
                               data-th-text="${cliente.nombre}">
                                Nombre del cliente
                            </p>
                        </div>

                        <div class="detalle-item">
                            <p class="detalle-etiqueta">Empresa</p>
                            <p class="detalle-valor"
                               data-th-text="${#strings.isEmpty(cliente.empresa) ? 'No registrada' : cliente.empresa}">
                                Empresa
                            </p>
                        </div>

                        <div class="detalle-item">
                            <p class="detalle-etiqueta">Correo electrónico</p>
                            <p class="detalle-valor"
                               data-th-text="${#strings.isEmpty(cliente.correo) ? 'No registrado' : cliente.correo}">
                                correo@ejemplo.com
                            </p>
                        </div>

                        <div class="detalle-item">
                            <p class="detalle-etiqueta">Teléfono</p>
                            <p class="detalle-valor"
                               data-th-text="${#strings.isEmpty(cliente.telefono) ? 'No registrado' : cliente.telefono}">
                                0000-0000
                            </p>
                        </div>

                        <div class="detalle-item ancho-completo">
                            <p class="detalle-etiqueta">Dirección</p>
                            <p class="detalle-valor"
                               data-th-text="${#strings.isEmpty(cliente.direccion) ? 'No registrada' : cliente.direccion}">
                                Dirección del cliente
                            </p>
                        </div>

                    </div>

                    <div class="acciones-formulario">

                        <a class="boton-secundario"
                           href="/clientes"
                           data-th-href="@{/clientes}">
                            Regresar
                        </a>

                        <a class="boton-guardar"
                           href="#"
                           data-th-href="@{/clientes/actualizar/{id}(id=${cliente.idCliente})}">
                            Actualizar cliente
                        </a>

                    </div>

                </div>

            </div>

        </section>

    </main>

</div>

</body>
</html>
