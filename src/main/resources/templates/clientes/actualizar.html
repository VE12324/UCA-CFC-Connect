<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Actualizar cliente</title>

    <link rel="stylesheet"
          href="/css/estilos.css"
          data-th-href="@{/css/estilos.css}">
</head>

<body>

<div class="aplicacion">

    <aside th:replace="~{fragmentos/plantilla :: barra-lateral('clientes')}"></aside>

    <main class="area-principal">

        <header th:replace="~{fragmentos/plantilla :: barra-superior}"></header>

        <section class="contenido">

            <div class="formulario-tarjeta">

                <div class="tarjeta-encabezado">
                    <h1>Actualizar cliente</h1>
                    <p>Modifique la información del cliente seleccionado.</p>
                </div>

                <div class="tarjeta-cuerpo">

                    <form method="post"
                          data-th-action="@{/clientes/actualizar/{id}(id=${cliente.idCliente})}"
                          data-th-object="${cliente}">

                        <input type="hidden"
                               data-th-field="*{idCliente}">

                        <div class="formulario-cuadricula">

                            <div class="grupo-formulario">
                                <label for="dui">DUI o NIT</label>

                                <input class="campo-formulario"
                                       type="text"
                                       id="dui"
                                       maxlength="20"
                                       data-th-field="*{dui}">

                                <span class="texto-error"
                                      data-th-if="${#fields.hasErrors('dui')}"
                                      data-th-errors="*{dui}">
                                </span>
                            </div>

                            <div class="grupo-formulario">
                                <label for="nombre">Nombre</label>

                                <input class="campo-formulario"
                                       type="text"
                                       id="nombre"
                                       maxlength="150"
                                       data-th-field="*{nombre}"
                                       required>

                                <span class="texto-error"
                                      data-th-if="${#fields.hasErrors('nombre')}"
                                      data-th-errors="*{nombre}">
                                </span>
                            </div>

                            <div class="grupo-formulario">
                                <label for="empresa">Empresa</label>

                                <input class="campo-formulario"
                                       type="text"
                                       id="empresa"
                                       maxlength="150"
                                       data-th-field="*{empresa}">
                            </div>

                            <div class="grupo-formulario">
                                <label for="correo">Correo electrónico</label>

                                <input class="campo-formulario"
                                       type="email"
                                       id="correo"
                                       maxlength="150"
                                       data-th-field="*{correo}">

                                <span class="texto-error"
                                      data-th-if="${#fields.hasErrors('correo')}"
                                      data-th-errors="*{correo}">
                                </span>
                            </div>

                            <div class="grupo-formulario">
                                <label for="telefono">Teléfono</label>

                                <input class="campo-formulario"
                                       type="text"
                                       id="telefono"
                                       maxlength="30"
                                       data-th-field="*{telefono}">
                            </div>

                            <div class="grupo-formulario ancho-completo">
                                <label for="direccion">Dirección</label>

                                <textarea class="campo-formulario"
                                          id="direccion"
                                          maxlength="255"
                                          data-th-field="*{direccion}">
                                </textarea>
                            </div>

                        </div>

                        <div class="acciones-formulario">

                            <a class="boton-secundario"
                               href="/clientes"
                               data-th-href="@{/clientes}">
                                Cancelar
                            </a>

                            <button class="boton-guardar"
                                    type="submit">
                                Guardar cambios
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </section>

    </main>

</div>

</body>
</html>
