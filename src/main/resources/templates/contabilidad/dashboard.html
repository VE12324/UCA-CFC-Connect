<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de contabilidad — UCA CFC Connect</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <style>
        .cuadricula-kpi {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 28px;
        }


        .tarjeta-kpi {
            padding: 24px;
            border: 1px solid var(--borde);
            border-radius: var(--radio);
            background-color: var(--blanco);
            box-shadow: var(--sombra);
        }


        .kpi-etiqueta {
            margin-bottom: 10px;
            color: var(--texto-suave);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }


        .kpi-valor {
            color: var(--primario);
            font-size: 38px;
            font-weight: 700;
            line-height: 1;
        }


        .kpi-icono {
            width: 38px;
            height: 38px;
            margin-bottom: 14px;
            display: block;
            object-fit: contain;
        }


        .cuadricula-accesos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }


        .tarjeta-acceso {
            padding: 22px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--borde);
            border-radius: var(--radio);
            background-color: var(--blanco);
            box-shadow: var(--sombra);
            color: var(--texto);
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
        }


        .tarjeta-acceso:hover {
            border-color: var(--secundario);
            background-color: var(--terciario);
            color: #263000;
            transform: translateY(-2px);
        }


        .acceso-signo {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background-color: var(--secundario);
            color: #263000;
            font-size: 20px;
            font-weight: 700;
        }


        .seccion-titulo {
            margin-bottom: 16px;
            color: var(--texto);
            font-size: 17px;
            font-weight: 700;
        }


        @media (max-width: 1100px) {
            .cuadricula-kpi,
            .cuadricula-accesos {
                grid-template-columns: repeat(2, 1fr);
            }
        }


        @media (max-width: 600px) {
            .cuadricula-kpi,
            .cuadricula-accesos {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>


<div class="aplicacion">


    <aside th:replace="~{fragmentos/plantilla :: barra-lateral('dashboard')}"></aside>


    <section class="area-principal">


        <header th:replace="~{fragmentos/plantilla :: barra-superior}"></header>


        <main class="contenido">


            <div class="encabezado-pagina">
                <div class="titulo-pagina">
                    <h1>Panel de contabilidad</h1>
                    <p>Resumen financiero de pagos del Centro de Formación Continua.</p>
                </div>
            </div>


            <div class="cuadricula-kpi">


                <div class="tarjeta-kpi">
                    <img class="kpi-icono"
                         th:src="@{/iconos/pagos.png}"
                         src="/iconos/pagos.png"
                         alt="Total recaudado">
                    <p class="kpi-etiqueta">Total recaudado</p>
                    <p class="kpi-valor" th:text="${'$' + #numbers.formatDecimal(totalRecaudado, 1, 2)}">$0.00</p>
                </div>


                <div class="tarjeta-kpi">
                    <img class="kpi-icono"
                         th:src="@{/iconos/pagos.png}"
                         src="/iconos/pagos.png"
                         alt="Pagos pendientes">
                    <p class="kpi-etiqueta">Pagos pendientes</p>
                    <p class="kpi-valor" th:text="${pagosPendientes}">0</p>
                </div>


                <div class="tarjeta-kpi">
                    <img class="kpi-icono"
                         th:src="@{/iconos/pagos.png}"
                         src="/iconos/pagos.png"
                         alt="Pagos validados este mes">
                    <p class="kpi-etiqueta">Pagos validados este mes</p>
                    <p class="kpi-valor" th:text="${pagosValidadosEsteMes}">0</p>
                </div>


            </div>


            <p class="seccion-titulo">Accesos rápidos</p>
            <div class="cuadricula-accesos">


                <a class="tarjeta-acceso" th:href="@{/contabilidad/pagos/crear}" href="/contabilidad/pagos/crear">
                    <span class="acceso-signo">＋</span>
                    Registrar pago
                </a>


                <a class="tarjeta-acceso" th:href="@{/contabilidad/pagos}" href="/contabilidad/pagos">
                    <span class="acceso-signo">✓</span>
                    Validar pago
                </a>


            </div>


        </main>


    </section>


</div>


</body>
</html>
