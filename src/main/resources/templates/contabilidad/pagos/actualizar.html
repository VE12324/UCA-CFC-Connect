<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Actualizar pago</title>
    <link rel="stylesheet"
          href="/css/estilos.css"
          th:href="@{/css/estilos.css}">
</head>
<body>
<div class="aplicacion">

    <aside th:replace="~{fragmentos/plantilla :: barra-lateral('pagos-contabilidad')}"></aside>

    <section class="area-principal">

        <header th:replace="~{fragmentos/plantilla :: barra-superior}"></header>
        <main class="contenido">
            <div class="formulario-tarjeta">

                <div class="tarjeta-encabezado">

                    <h1>Actualizar pago</h1>

                    <p>
                        Puede corregir la fecha, el monto y el método de pago. El cliente y el concepto no cambian.
                    </p>
                </div>

                <div class="tarjeta-cuerpo">

                    <form th:action="@{/contabilidad/pagos/actualizar/{id}(id=${idPago})}"
                          th:object="${pago}"
                          method="post">


                        <div class="mensaje mensaje-error"
                             th:if="${#fields.hasGlobalErrors()}"
                             th:each="errorGlobal : ${#fields.globalErrors()}"
                             th:text="${errorGlobal}">
                        </div>

                        <div class="formulario-cuadricula">

                            <div class="grupo-formulario">


                                <label for="nombreCliente">
                                    Cliente
                                </label>

                                <input class="campo-formulario"
                                       id="nombreCliente"
                                       type="text"
                                       th:value="${nombreCliente}"
                                       readonly>


                                <input type="hidden" th:field="*{idCliente}">

                            </div>

                            <div class="grupo-formulario ancho-completo">


                                <label for="descripcionConcepto">
                                    Concepto del pago
                                </label>


                                <input class="campo-formulario"
                                       id="descripcionConcepto"
                                       type="text"
                                       th:value="${concepto != null ? concepto.etiquetaTipo + ' — ' + concepto.descripcion : 'Sin especificar'}"
                                       readonly>


                                <small class="texto-ayuda"
                                       th:if="${concepto != null}"
                                       th:text="${'Total ' + '$' + #numbers.formatDecimal(concepto.total, 1, 2)
                                                 + ' · pagado en otros pagos ' + '$' + #numbers.formatDecimal(concepto.pagado, 1, 2)
                                                 + ' · este pago puede ser de hasta ' + '$' + #numbers.formatDecimal(concepto.saldo, 1, 2)}">
                                </small>

                                <small class="texto-ayuda">
                                    El cliente y el concepto no se pueden cambiar. Si el pago se registró mal, elimínelo y regístrelo de nuevo.
                                </small>


                                <input type="hidden" th:field="*{tipoPago}">
                                <input type="hidden" th:field="*{idReferencia}">


                            </div>


                            <div class="grupo-formulario">


                                <label for="idMetodoPago">
                                    Método de pago *
                                </label>


                                <select class="campo-formulario"
                                        id="idMetodoPago"
                                        th:field="*{idMetodoPago}"
                                        th:classappend="${#fields.hasErrors('idMetodoPago')} ? 'invalido' : ''">


                                    <option value="">Seleccione un método</option>


                                    <option th:each="metodo : ${metodosPago}"
                                            th:value="${metodo.idMetodoPago}"
                                            th:text="${metodo.nombre}">
                                        Efectivo
                                    </option>

                                </select>

                                <span class="texto-error"
                                      th:if="${#fields.hasErrors('idMetodoPago')}"
                                      th:errors="*{idMetodoPago}">
                               </span>

                            </div>

                            <div class="grupo-formulario">


                                <label for="fecha">
                                    Fecha *
                                </label>


                                <input class="campo-formulario"
                                       id="fecha"
                                       type="date"
                                       th:field="*{fecha}"
                                       th:classappend="${#fields.hasErrors('fecha')} ? 'invalido' : ''">


                                <span class="texto-error"
                                      th:if="${#fields.hasErrors('fecha')}"
                                      th:errors="*{fecha}">
                               </span>

                            </div>

                            <div class="grupo-formulario">

                                <label for="monto">
                                    Monto (USD) *
                                </label>

                                <input class="campo-formulario"
                                       id="monto"
                                       type="number"
                                       step="0.01"
                                       min="0.01"
                                       th:field="*{monto}"
                                       th:attr="max=${concepto != null ? concepto.saldo : null}"
                                       th:classappend="${#fields.hasErrors('monto')} ? 'invalido' : ''"
                                       placeholder="0.00">


                                <span class="texto-error"
                                      th:if="${#fields.hasErrors('monto')}"
                                      th:errors="*{monto}">
                               </span>

                            </div>

                        </div>

                        <div class="acciones-formulario">


                            <a class="boton-secundario"
                               href="/contabilidad/pagos"
                               th:href="@{/contabilidad/pagos}">
                                Cancelar
                            </a>

                            <button class="boton-guardar"
                                    type="submit">
                                Guardar cambios
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </section>
</div>
</body>
</html>
