<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Actualizar participante</title>

    <link rel="stylesheet"
          href="/css/estilos.css"
          data-th-href="@{/css/estilos.css}">
</head>

<body>

<div class="aplicacion">

    <aside th:replace="~{fragmentos/plantilla :: barra-lateral('participantes')}"></aside>

    <main class="area-principal">

        <header th:replace="~{fragmentos/plantilla :: barra-superior}"></header>

        <section class="contenido">

            <div class="formulario-tarjeta">

                <div class="tarjeta-encabezado">

                    <h1>Actualizar participante</h1>

                    <p>
                        Modifique la información del participante
                        seleccionado.
                    </p>

                </div>

                <div class="tarjeta-cuerpo">

                    <form method="post"
                          data-th-action="@{/participantes/actualizar/{id}(id=${participante.idParticipante})}"
                          data-th-object="${participante}">

                        <input type="hidden"
                               data-th-field="*{idParticipante}">

                        <div class="formulario-cuadricula">

                            <div class="grupo-formulario">

                                <label for="dui">
                                    DUI
                                </label>

                                <input class="campo-formulario"
                                       type="text"
                                       id="dui"
                                       maxlength="20"
                                       placeholder="00000000-0"
                                       data-th-field="*{dui}">

                                <span class="texto-error"
                                      data-th-if="${#fields.hasErrors('dui')}"
                                      data-th-errors="*{dui}">
                                </span>

                            </div>

                            <div class="grupo-formulario">

                                <label for="nombre">
                                    Nombre
                                </label>

                                <input class="campo-formulario"
                                       type="text"
                                       id="nombre"
                                       maxlength="100"
                                       placeholder="Nombre del participante"
                                       data-th-field="*{nombre}"
                                       required>

                                <span class="texto-error"
                                      data-th-if="${#fields.hasErrors('nombre')}"
                                      data-th-errors="*{nombre}">
                                </span>

                            </div>

                            <div class="grupo-formulario">

                                <label for="apellido">
                                    Apellido
                                </label>

                                <input class="campo-formulario"
                                       type="text"
                                       id="apellido"
                                       maxlength="100"
                                       placeholder="Apellido del participante"
                                       data-th-field="*{apellido}"
                                       required>

                                <span class="texto-error"
                                      data-th-if="${#fields.hasErrors('apellido')}"
                                      data-th-errors="*{apellido}">
                                </span>

                            </div>

                            <div class="grupo-formulario">

                                <label for="correo">
                                    Correo electrónico
                                </label>

                                <input class="campo-formulario"
                                       type="email"
                                       id="correo"
                                       maxlength="150"
                                       placeholder="participante@correo.com"
                                       data-th-field="*{correo}">

                                <span class="texto-error"
                                      data-th-if="${#fields.hasErrors('correo')}"
                                      data-th-errors="*{correo}">
                                </span>

                            </div>

                            <div class="grupo-formulario">

                                <label for="telefono">
                                    Teléfono
                                </label>

                                <input class="campo-formulario"
                                       type="text"
                                       id="telefono"
                                       maxlength="30"
                                       placeholder="+503 0000-0000"
                                       data-th-field="*{telefono}">

                                <span class="texto-error"
                                      data-th-if="${#fields.hasErrors('telefono')}"
                                      data-th-errors="*{telefono}">
                                </span>

                            </div>

                        </div>

                        <div class="acciones-formulario">

                            <a class="boton-secundario"
                               href="/participantes"
                               data-th-href="@{/participantes}">
                                Cancelar
                            </a>

                            <button class="boton-guardar"
                                    type="submit">
                                Guardar cambios
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </section>

    </main>

</div>

</body>
</html>
