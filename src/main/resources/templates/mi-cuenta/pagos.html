<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mis pagos</title>

    <link rel="stylesheet"
          href="/css/estilos.css"
          th:href="@{/css/estilos.css}">
</head>

<body>

<div class="aplicacion">

    <aside th:replace="~{fragmentos/plantilla :: barra-lateral('mis-pagos')}">
    </aside>

    <main class="area-principal">

        <header th:replace="~{fragmentos/plantilla :: barra-superior}">
        </header>

        <section class="contenido">

            <div style="margin-bottom:25px;">

                <h1 style="margin-bottom:6px;">
                    Mis pagos
                </h1>

                <p style="margin:0; color:#687078;">
                    Consulte el historial de pagos de su cuenta.
                </p>

            </div>

            <div class="formulario-tarjeta">

                <div class="tarjeta-cuerpo"
                     style="overflow-x:auto;">

                    <div th:if="${pagos == null
                         or #lists.isEmpty(pagos)}"
                         style="padding:30px;
                                text-align:center;
                                color:#687078;">

                        No tiene pagos registrados.

                    </div>

                    <table th:if="${pagos != null
                           and !#lists.isEmpty(pagos)}"
                           style="width:100%;
                                  border-collapse:collapse;">

                        <thead>

                            <tr style="background:#00636d;
                                       color:white;">

                                <th style="padding:12px;">Fecha</th>
                                <th style="padding:12px;">Concepto</th>
                                <th style="padding:12px;">Método</th>
                                <th style="padding:12px;">Referencia</th>
                                <th style="padding:12px;">Monto</th>
                                <th style="padding:12px;">Estado</th>
                                <th style="padding:12px;">Comprobante</th>

                            </tr>

                        </thead>

                        <tbody>

                            <tr th:each="pago : ${pagos}"
                                style="border-bottom:1px solid #ddd;">

                                <td style="padding:12px;"
                                    th:text="${#temporals.format(
                                    pago.fecha,
                                    'dd/MM/yyyy')}">

                                    01/01/2026

                                </td>

                                <td style="padding:12px;">

                                    <span th:text="${pago.tipoPago != null
                                          ? pago.tipoPago.etiqueta
                                          + ' #' + pago.idReferencia
                                          : 'Sin concepto'}">

                                        Concepto

                                    </span>

                                </td>

                                <td style="padding:12px;"
                                    th:text="${pago.nombreMetodoPago}">

                                    Método

                                </td>

                                <td style="padding:12px;"
                                    th:text="${pago.numeroReferenciaExterna != null
                                    and !pago.numeroReferenciaExterna.isBlank()
                                    ? pago.numeroReferenciaExterna
                                    : 'Sin referencia'}">

                                    Sin referencia

                                </td>

                                <td style="padding:12px;"
                                    th:text="'$'
                                    + ${#numbers.formatDecimal(
                                    pago.monto, 1, 2)}">

                                    $0.00

                                </td>

                                <td style="padding:12px;"
                                    th:text="${pago.estado}">

                                    Pendiente

                                </td>

                                <td style="padding:12px;"
                                    th:text="${pago.fechaEmision != null
                                    ? #temporals.format(
                                    pago.fechaEmision,
                                    'dd/MM/yyyy')
                                    : 'No emitido'}">

                                    No emitido

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>

</div>

</body>
</html>
