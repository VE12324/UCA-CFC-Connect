<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis pagos — CFC UCA</title>
    <link rel="stylesheet" th:href="@{/css/cliente.css}" href="/css/cliente.css">
</head>
<body class="portal">


<div th:replace="~{fragmentos/plantilla-cliente :: barra('cuenta')}"></div>
<div th:replace="~{fragmentos/plantilla-cliente :: aviso-perfil}"></div>


<main class="portal-principal">
    <div class="portal-contenedor">


        <div class="portal-encabezado">
            <h1>Mis pagos</h1>
            <p>Consulta el historial de pagos de tu cuenta.</p>
        </div>


        <!-- Resumen calculado sobre todos los pagos del cliente de la sesión. -->
        <div class="resumen-cuadricula"
             th:with="resumen=${@solicitudClienteService.resumenPagos(#authentication.name)}">
            <div class="resumen-tarjeta lima">
                <small>Total pagado</small>
                <strong th:text="${@formatoPortal.dinero(resumen.totalPagado())}">$0.00</strong>
            </div>
            <div class="resumen-tarjeta">
                <small>Pendiente de validar</small>
                <strong th:text="${@formatoPortal.dinero(resumen.totalPorValidar())}">$0.00</strong>
            </div>
            <div class="resumen-tarjeta">
                <small>Pagos registrados</small>
                <strong th:text="${resumen.cantidadPagos()}">0</strong>
            </div>
        </div>


        <section class="tarjeta">
            <p class="vacio" th:if="${pagos == null or #lists.isEmpty(pagos)}">
                No tienes pagos registrados.
            </p>


            <div class="tabla-envoltura" th:if="${pagos != null and !#lists.isEmpty(pagos)}">
                <table class="tabla">
                    <thead>
                    <tr>
                        <th>Fecha</th><th>Concepto</th><th>Método</th>
                        <th class="numero">Monto</th><th>Estado</th><th>Comprobante</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="pago : ${pagos}">
                        <td th:text="${pago.fecha != null ? #temporals.format(pago.fecha, 'dd/MM/yyyy') : 'Sin fecha'}">01/01/2026</td>
                        <td>
                           <span th:if="${pago.tipoPago != null}"
                                 th:text="${pago.tipoPago.etiqueta + (pago.idReferencia != null ? ' #' + pago.idReferencia : '')}">Concepto</span>
                            <span th:if="${pago.tipoPago == null}">Sin concepto</span>
                        </td>
                        <td th:text="${pago.metodoPago != null and !pago.metodoPago.isBlank() ? pago.metodoPago : 'Sin método'}">Método</td>
                        <td class="numero" th:text="${@formatoPortal.dinero(pago.monto)}">$0.00</td>
                        <td><span th:class="${@formatoPortal.claseEstado(pago.estado)}"
                                  th:text="${pago.estado != null ? pago.estado : 'Sin estado'}">Pendiente</span></td>
                        <td th:text="${pago.fechaEmision != null ? #temporals.format(pago.fechaEmision, 'dd/MM/yyyy') : 'No emitido'}">No emitido</td>
                    </tr>
                    </tbody>
                </table>
            </div>


            <nav th:replace="~{fragmentos/plantilla-cliente :: paginacion(${paginaPagos}, '/mi-cuenta/pagos')}"></nav>
        </section>
    </div>
</main>


<footer th:replace="~{fragmentos/plantilla-cliente :: pie}"></footer>
</body>
</html>
