<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis inscripciones — CFC UCA</title>
    <link rel="stylesheet" th:href="@{/css/cliente.css}" href="/css/cliente.css">
</head>
<body class="portal">


<div th:replace="~{fragmentos/plantilla-cliente :: barra('cuenta')}"></div>
<div th:replace="~{fragmentos/plantilla-cliente :: aviso-perfil}"></div>


<main class="portal-principal">
    <div class="portal-contenedor">


        <div class="portal-encabezado">
            <h1>Mis inscripciones</h1>
            <p>Consulta los cursos en los que estás inscrito. Las inscripciones las registra el equipo de recepción.</p>
        </div>


        <section class="tarjeta">
            <p class="vacio" th:if="${inscripciones == null or #lists.isEmpty(inscripciones)}">
                No tienes inscripciones registradas.
            </p>


            <div class="tabla-envoltura" th:if="${inscripciones != null and !#lists.isEmpty(inscripciones)}">
                <table class="tabla">
                    <thead><tr><th>Fecha</th><th>Curso</th><th>Estado</th><th>Participantes</th></tr></thead>
                    <tbody>
                    <tr th:each="inscripcion : ${inscripciones}">
                        <td th:text="${#temporals.format(inscripcion.fecha, 'dd/MM/yyyy')}">01/01/2026</td>
                        <td th:text="${inscripcion.curso.nombre}">Curso</td>
                        <td><span th:class="${@formatoPortal.claseEstado(inscripcion.estadoInscripcion.nombre)}"
                                  th:text="${inscripcion.estadoInscripcion.nombre}">Pendiente</span></td>
                        <td th:text="${inscripcion.participantes != null ? #sets.size(inscripcion.participantes) : 0}">0</td>
                    </tr>
                    </tbody>
                </table>
            </div>


            <nav th:replace="~{fragmentos/plantilla-cliente :: paginacion(${paginaInscripciones}, '/mi-cuenta/inscripciones')}"></nav>
        </section>
    </div>
</main>


<footer th:replace="~{fragmentos/plantilla-cliente :: pie}"></footer>
</body>
</html>
