<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mis inscripciones</title>

    <link rel="stylesheet"
          href="/css/estilos.css"
          th:href="@{/css/estilos.css}">
</head>

<body>

<div class="aplicacion">

    <aside th:replace="~{fragmentos/plantilla :: barra-lateral('mis-inscripciones')}">
    </aside>

    <main class="area-principal">

        <header th:replace="~{fragmentos/plantilla :: barra-superior}">
        </header>

        <section class="contenido">

            <div style="margin-bottom:25px;">

                <h1 style="margin-bottom:6px;">
                    Mis inscripciones
                </h1>

                <p style="margin:0; color:#687078;">
                    Consulte los cursos en los que está inscrito.
                </p>

            </div>

            <div class="formulario-tarjeta">

                <div class="tarjeta-cuerpo"
                     style="overflow-x:auto;">

                    <div th:if="${inscripciones == null
                         or #lists.isEmpty(inscripciones)}"
                         style="padding:30px;
                                text-align:center;
                                color:#687078;">

                        No tiene inscripciones registradas.

                    </div>

                    <table th:if="${inscripciones != null
                           and !#lists.isEmpty(inscripciones)}"
                           style="width:100%;
                                  border-collapse:collapse;">

                        <thead>

                            <tr style="background:#00636d;
                                       color:white;">

                                <th style="padding:14px;">
                                    Fecha
                                </th>

                                <th style="padding:14px;">
                                    Curso
                                </th>

                                <th style="padding:14px;">
                                    Estado
                                </th>

                                <th style="padding:14px;">
                                    Participantes
                                </th>

                            </tr>

                        </thead>

                        <tbody>

                            <tr th:each="inscripcion : ${inscripciones}"
                                style="border-bottom:1px solid #ddd;">

                                <td style="padding:14px;"
                                    th:text="${#temporals.format(
                                    inscripcion.fecha,
                                    'dd/MM/yyyy')}">

                                    01/01/2026

                                </td>

                                <td style="padding:14px;"
                                    th:text="${inscripcion.curso.nombre}">

                                    Nombre del curso

                                </td>

                                <td style="padding:14px;"
                                    th:text="${inscripcion.estadoInscripcion.nombre}">

                                    Pendiente

                                </td>

                                <td style="padding:14px;"
                                    th:text="${inscripcion.participantes != null
                                    ? #sets.size(inscripcion.participantes)
                                    : 0}">

                                    0

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>

</div>

</body>
</html>
