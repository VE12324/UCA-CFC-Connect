<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi catering — CFC UCA</title>
    <link rel="stylesheet" th:href="@{/css/cliente.css}" href="/css/cliente.css">
</head>
<body class="portal">


<div th:replace="~{fragmentos/plantilla-cliente :: barra('cuenta')}"></div>
<div th:replace="~{fragmentos/plantilla-cliente :: aviso-perfil}"></div>


<main class="portal-principal">
    <div class="portal-contenedor">


        <div class="seccion-encabezado">
            <div class="portal-encabezado" style="margin:0;">
                <h1>Mi catering</h1>
                <p>Consulta tus solicitudes de catering y su estado.</p>
            </div>
            <a class="boton-lima" th:href="@{/portal/catering}">Solicitar catering</a>
        </div>


        <section class="tarjeta">
            <p class="vacio" th:if="${solicitudes == null or #lists.isEmpty(solicitudes)}">
                No tienes solicitudes de catering registradas.
            </p>


            <div class="tabla-envoltura" th:if="${solicitudes != null and !#lists.isEmpty(solicitudes)}">
                <table class="tabla">
                    <thead><tr><th>Fecha</th><th>Hora</th><th>Servicio</th><th>Menú</th><th>Lugar</th><th>Asistentes</th><th>Estado</th></tr></thead>
                    <tbody>
                    <tr th:each="solicitud : ${solicitudes}">
                        <td th:text="${#temporals.format(solicitud.fecha, 'dd/MM/yyyy')}">01/01/2026</td>
                        <td th:text="${@formatoPortal.hora(solicitud.hora)}">10:00</td>
                        <td th:text="${solicitud.servicioCatering.nombre}">Servicio</td>
                        <td th:text="${solicitud.menu}">Menú</td>
                        <td th:text="${solicitud.lugar}">Lugar</td>
                        <td th:text="${solicitud.cantidadAsistentes}">20</td>
                        <td><span th:class="${@formatoPortal.claseEstado(solicitud.estado)}"
                                  th:text="${@formatoPortal.estado(solicitud.estado)}">Pendiente</span></td>
                    </tr>
                    </tbody>
                </table>
            </div>


            <nav th:replace="~{fragmentos/plantilla-cliente :: paginacion(${paginaCatering}, '/mi-cuenta/catering')}"></nav>
        </section>
    </div>
</main>


<footer th:replace="~{fragmentos/plantilla-cliente :: pie}"></footer>
</body>
</html>
