<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mis solicitudes de catering</title>

    <link rel="stylesheet"
          href="/css/estilos.css"
          th:href="@{/css/estilos.css}">
</head>

<body>

<div class="aplicacion">

    <aside th:replace="~{fragmentos/plantilla :: barra-lateral('mi-catering')}">
    </aside>

    <main class="area-principal">

        <header th:replace="~{fragmentos/plantilla :: barra-superior}">
        </header>

        <section class="contenido">

            <div style="margin-bottom:25px;">

                <h1 style="margin-bottom:6px;">
                    Mis solicitudes de catering
                </h1>

                <p style="margin:0; color:#687078;">
                    Consulte los servicios de catering solicitados.
                </p>

            </div>

            <div class="formulario-tarjeta">

                <div class="tarjeta-cuerpo"
                     style="overflow-x:auto;">

                    <div th:if="${solicitudes == null
                         or #lists.isEmpty(solicitudes)}"
                         style="padding:30px;
                                text-align:center;
                                color:#687078;">

                        No tiene solicitudes de catering registradas.

                    </div>

                    <table th:if="${solicitudes != null
                           and !#lists.isEmpty(solicitudes)}"
                           style="width:100%;
                                  border-collapse:collapse;">

                        <thead>

                            <tr style="background:#00636d;
                                       color:white;">

                                <th style="padding:12px;">Fecha</th>
                                <th style="padding:12px;">Hora</th>
                                <th style="padding:12px;">Servicio</th>
                                <th style="padding:12px;">Menú</th>
                                <th style="padding:12px;">Lugar</th>
                                <th style="padding:12px;">Asistentes</th>
                                <th style="padding:12px;">Estado</th>

                            </tr>

                        </thead>

                        <tbody>

                            <tr th:each="solicitud : ${solicitudes}"
                                style="border-bottom:1px solid #ddd;">

                                <td style="padding:12px;"
                                    th:text="${#temporals.format(
                                    solicitud.fecha,
                                    'dd/MM/yyyy')}">

                                    01/01/2026

                                </td>

                                <td style="padding:12px;"
                                    th:text="${#temporals.format(
                                    solicitud.hora,
                                    'HH:mm')}">

                                    08:00

                                </td>

                                <td style="padding:12px;"
                                    th:text="${solicitud.servicioCatering.nombre}">

                                    Servicio

                                </td>

                                <td style="padding:12px;"
                                    th:text="${solicitud.menu}">

                                    Menú

                                </td>

                                <td style="padding:12px;"
                                    th:text="${solicitud.lugar}">

                                    Lugar

                                </td>

                                <td style="padding:12px;"
                                    th:text="${solicitud.cantidadAsistentes}">

                                    1

                                </td>

                                <td style="padding:12px;"
                                    th:text="${solicitud.estado}">

                                    PENDIENTE

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>

</div>

</body>
</html>
