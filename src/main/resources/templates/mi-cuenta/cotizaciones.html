<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mis cotizaciones</title>

    <link rel="stylesheet"
          href="/css/estilos.css"
          th:href="@{/css/estilos.css}">
</head>

<body>

<div class="aplicacion">

    <aside th:replace="~{fragmentos/plantilla :: barra-lateral('mis-cotizaciones')}">
    </aside>

    <main class="area-principal">

        <header th:replace="~{fragmentos/plantilla :: barra-superior}">
        </header>

        <section class="contenido">

            <div style="margin-bottom:25px;">

                <h1 style="margin-bottom:6px;">
                    Mis cotizaciones
                </h1>

                <p style="margin:0; color:#687078;">
                    Consulte sus cotizaciones y el detalle de cada una.
                </p>

            </div>

            <div th:if="${cotizaciones == null
                 or #lists.isEmpty(cotizaciones)}"
                 class="formulario-tarjeta">

                <div class="tarjeta-cuerpo"
                     style="padding:30px;
                            text-align:center;
                            color:#687078;">

                    No tiene cotizaciones registradas.

                </div>

            </div>

            <div th:each="cotizacion : ${cotizaciones}"
                 class="formulario-tarjeta"
                 style="margin-bottom:20px;">

                <div class="tarjeta-encabezado">

                    <h2 th:text="'Cotización #'
                        + ${cotizacion.idCotizacion}">

                        Cotización #1

                    </h2>

                    <p>
                        Fecha:

                        <span th:text="${#temporals.format(
                              cotizacion.fecha,
                              'dd/MM/yyyy')}">

                            01/01/2026

                        </span>
                    </p>

                </div>

                <div class="tarjeta-cuerpo"
                     style="overflow-x:auto;">

                    <p style="margin-bottom:18px;">

                        <strong>Estado:</strong>

                        <span th:text="${cotizacion.estado}">
                            Pendiente
                        </span>

                    </p>

                    <div th:if="${cotizacion.detalles == null
                         or #lists.isEmpty(cotizacion.detalles)}"
                         style="padding:20px;
                                text-align:center;
                                color:#687078;">

                        La cotización no tiene detalles registrados.

                    </div>

                    <table th:if="${cotizacion.detalles != null
                           and !#lists.isEmpty(cotizacion.detalles)}"
                           style="width:100%;
                                  border-collapse:collapse;">

                        <thead>

                            <tr style="background:#00636d;
                                       color:white;">

                                <th style="padding:12px;">
                                    Descripción
                                </th>

                                <th style="padding:12px;">
                                    Cantidad
                                </th>

                                <th style="padding:12px;">
                                    Precio
                                </th>

                                <th style="padding:12px;">
                                    Subtotal
                                </th>

                            </tr>

                        </thead>

                        <tbody>

                            <tr th:each="detalle : ${cotizacion.detalles}"
                                style="border-bottom:1px solid #ddd;">

                                <td style="padding:12px;"
                                    th:text="${detalle.descripcion}">

                                    Descripción

                                </td>

                                <td style="padding:12px;"
                                    th:text="${detalle.cantidad}">

                                    1

                                </td>

                                <td style="padding:12px;"
                                    th:text="'$'
                                    + ${#numbers.formatDecimal(
                                    detalle.precio, 1, 2)}">

                                    $0.00

                                </td>

                                <td style="padding:12px;"
                                    th:text="'$'
                                    + ${#numbers.formatDecimal(
                                    detalle.subtotal, 1, 2)}">

                                    $0.00

                                </td>

                            </tr>

                        </tbody>

                    </table>

                    <div style="margin-top:18px;
                                text-align:right;">

                        <p>
                            <strong>Subtotal:</strong>

                            <span th:text="'$'
                                  + ${#numbers.formatDecimal(
                                  cotizacion.subtotal, 1, 2)}">

                                $0.00

                            </span>
                        </p>

                        <p style="font-size:18px;
                                  margin-top:8px;">

                            <strong>Total:</strong>

                            <span th:text="'$'
                                  + ${#numbers.formatDecimal(
                                  cotizacion.total, 1, 2)}">

                                $0.00

                            </span>
                        </p>

                    </div>

                </div>

            </div>

        </section>

    </main>

</div>

</body>
</html>
