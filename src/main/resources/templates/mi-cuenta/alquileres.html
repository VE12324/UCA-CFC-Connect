<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis alquileres — CFC UCA</title>
    <link rel="stylesheet" th:href="@{/css/cliente.css}" href="/css/cliente.css">
</head>
<body class="portal">


<div th:replace="~{fragmentos/plantilla-cliente :: barra('cuenta')}"></div>
<div th:replace="~{fragmentos/plantilla-cliente :: aviso-perfil}"></div>


<main class="portal-principal">
    <div class="portal-contenedor">


        <div class="seccion-encabezado">
            <div class="portal-encabezado" style="margin:0;">
                <h1>Mis alquileres</h1>
                <p>Consulta tus reservas de espacios y su estado.</p>
            </div>
            <a class="boton-lima" th:href="@{/portal/espacios}">Reservar un espacio</a>
        </div>


        <section class="tarjeta">
            <p class="vacio" th:if="${alquileres == null or #lists.isEmpty(alquileres)}">
                No tienes alquileres registrados.
            </p>


            <div class="tabla-envoltura" th:if="${alquileres != null and !#lists.isEmpty(alquileres)}">
                <table class="tabla">
                    <thead><tr><th>Fecha</th><th>Espacio</th><th>Inicio</th><th>Finalización</th><th>Personas</th><th>Estado</th></tr></thead>
                    <tbody>
                    <tr th:each="alquiler : ${alquileres}">
                        <td th:text="${#temporals.format(alquiler.fecha, 'dd/MM/yyyy')}">01/01/2026</td>
                        <td th:text="${alquiler.espacio.nombre}">Espacio</td>
                        <td th:text="${#temporals.format(alquiler.horaInicio, 'dd/MM/yyyy HH:mm')}">01/01/2026 08:00</td>
                        <td th:text="${#temporals.format(alquiler.horaFin, 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</td>
                        <td th:text="${alquiler.cantidadPersonas}">10</td>
                        <td><span th:class="${@formatoPortal.claseEstado(alquiler.estado)}"
                                  th:text="${@formatoPortal.estado(alquiler.estado)}">Pendiente</span></td>
                    </tr>
                    </tbody>
                </table>
            </div>


            <nav th:replace="~{fragmentos/plantilla-cliente :: paginacion(${paginaAlquileres}, '/mi-cuenta/alquileres')}"></nav>
        </section>
    </div>
</main>


<footer th:replace="~{fragmentos/plantilla-cliente :: pie}"></footer>
</body>
</html>
