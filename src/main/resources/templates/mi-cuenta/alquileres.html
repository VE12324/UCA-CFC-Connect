<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mis alquileres</title>

    <link rel="stylesheet"
          href="/css/estilos.css"
          th:href="@{/css/estilos.css}">
</head>

<body>

<div class="aplicacion">

    <aside th:replace="~{fragmentos/plantilla :: barra-lateral('mis-alquileres')}">
    </aside>

    <main class="area-principal">

        <header th:replace="~{fragmentos/plantilla :: barra-superior}">
        </header>

        <section class="contenido">

            <div style="margin-bottom:25px;">

                <h1 style="margin-bottom:6px;">
                    Mis alquileres
                </h1>

                <p style="margin:0; color:#687078;">
                    Consulte sus reservaciones de espacios.
                </p>

            </div>

            <div class="formulario-tarjeta">

                <div class="tarjeta-cuerpo"
                     style="overflow-x:auto;">

                    <div th:if="${alquileres == null
                         or #lists.isEmpty(alquileres)}"
                         style="padding:30px;
                                text-align:center;
                                color:#687078;">

                        No tiene alquileres registrados.

                    </div>

                    <table th:if="${alquileres != null
                           and !#lists.isEmpty(alquileres)}"
                           style="width:100%;
                                  border-collapse:collapse;">

                        <thead>

                            <tr style="background:#00636d;
                                       color:white;">

                                <th style="padding:12px;">Fecha</th>
                                <th style="padding:12px;">Espacio</th>
                                <th style="padding:12px;">Inicio</th>
                                <th style="padding:12px;">Finalización</th>
                                <th style="padding:12px;">Personas</th>
                                <th style="padding:12px;">Estado</th>

                            </tr>

                        </thead>

                        <tbody>

                            <tr th:each="alquiler : ${alquileres}"
                                style="border-bottom:1px solid #ddd;">

                                <td style="padding:12px;"
                                    th:text="${#temporals.format(
                                    alquiler.fecha,
                                    'dd/MM/yyyy')}">

                                    01/01/2026

                                </td>

                                <td style="padding:12px;"
                                    th:text="${alquiler.espacio.nombre}">

                                    Espacio

                                </td>

                                <td style="padding:12px;"
                                    th:text="${#temporals.format(
                                    alquiler.horaInicio,
                                    'dd/MM/yyyy HH:mm')}">

                                    01/01/2026 08:00

                                </td>

                                <td style="padding:12px;"
                                    th:text="${#temporals.format(
                                    alquiler.horaFin,
                                    'dd/MM/yyyy HH:mm')}">

                                    01/01/2026 10:00

                                </td>

                                <td style="padding:12px;"
                                    th:text="${alquiler.cantidadPersonas}">

                                    1

                                </td>

                                <td style="padding:12px;"
                                    th:text="${alquiler.estado}">

                                    PENDIENTE

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>

</div>

</body>
</html>
