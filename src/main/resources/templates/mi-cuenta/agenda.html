<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda — CFC UCA</title>
    <link rel="stylesheet" th:href="@{/css/cliente.css}" href="/css/cliente.css">
</head>
<body class="portal">


<div th:replace="~{fragmentos/plantilla-cliente :: barra('cuenta')}"></div>
<div th:replace="~{fragmentos/plantilla-cliente :: aviso-perfil}"></div>


<main class="portal-principal">
    <div class="portal-contenedor">


        <div class="portal-encabezado">
            <h1>Agenda institucional</h1>
            <p>Consulta las actividades institucionales y las relacionadas con tus servicios.</p>
        </div>


        <section class="tarjeta">
            <p class="vacio" th:if="${actividades == null or #lists.isEmpty(actividades)}">
                No hay actividades disponibles.
            </p>


            <div class="tabla-envoltura" th:if="${actividades != null and !#lists.isEmpty(actividades)}">
                <table class="tabla">
                    <thead><tr><th>Fecha</th><th>Actividad</th><th>Tipo</th><th>Horario</th><th>Descripción</th></tr></thead>
                    <tbody>
                    <tr th:each="actividad : ${actividades}">
                        <td th:text="${#temporals.format(actividad.fecha, 'dd/MM/yyyy')}">01/01/2026</td>
                        <td th:text="${actividad.nombre}">Actividad</td>
                        <td th:text="${actividad.tipo}">Tipo</td>
                        <td th:text="${actividad.horario != null and !actividad.horario.isBlank()
                                   ? actividad.horario
                                   : actividad.horaInicio != null
                                       ? #temporals.format(actividad.horaInicio, 'dd/MM/yyyy HH:mm')
                                       : 'No especificado'}">No especificado</td>
                        <td th:text="${actividad.descripcion != null and !actividad.descripcion.isBlank()
                                   ? actividad.descripcion
                                   : 'Sin descripción'}">Sin descripción</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</main>


<footer th:replace="~{fragmentos/plantilla-cliente :: pie}"></footer>
</body>
</html>
