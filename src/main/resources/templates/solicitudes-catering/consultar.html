<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Detalle de Solicitud de Catering</title>

    <link rel="stylesheet"
          href="/css/estilos.css"
          th:href="@{/css/estilos.css}">
</head>

<body>

<div class="aplicacion">

    <aside th:replace="~{fragmentos/plantilla :: barra-lateral('solicitudes-catering')}"></aside>

    <section class="area-principal">

        <header th:replace="~{fragmentos/plantilla :: barra-superior}"></header>

        <main class="contenido">

            <div class="detalle-tarjeta">

                <div class="tarjeta-encabezado">

                    <h1>Detalle de la Solicitud</h1>

                    <p>
                        Información completa del servicio solicitado.
                    </p>

                </div>

                <div class="tarjeta-cuerpo">

                    <div class="detalles-cuadricula">

                        <div class="detalle-item">

                            <div class="detalle-etiqueta">ID</div>

                            <div class="detalle-valor"
                                 th:text="${solicitud.idSolicitud}">
                                1
                            </div>

                        </div>

                        <div class="detalle-item">

                            <div class="detalle-etiqueta">Estado</div>

                            <div class="detalle-valor"
                                 th:text="${solicitud.estado}">
                                PENDIENTE
                            </div>

                        </div>

                        <div class="detalle-item">

                            <div class="detalle-etiqueta">Fecha</div>

                            <div class="detalle-valor"
                                 th:text="${#temporals.format(
                                 solicitud.fecha,
                                 'dd/MM/yyyy'
                                 )}">
                                01/01/2026
                            </div>

                        </div>

                        <div class="detalle-item">

                            <div class="detalle-etiqueta">Hora</div>

                            <div class="detalle-valor"
                                 th:text="${#temporals.format(
                                 solicitud.hora,
                                 'HH:mm'
                                 )}">
                                12:00
                            </div>

                        </div>

                        <div class="detalle-item ancho-completo">

                            <div class="detalle-etiqueta">Cliente</div>

                            <div class="detalle-valor"
                                 th:text="${solicitud.cliente.nombre}">
                                Cliente
                            </div>

                        </div>

                        <div class="detalle-item ancho-completo">

                            <div class="detalle-etiqueta">
                                Servicio de catering
                            </div>

                            <div class="detalle-valor"
                                 th:text="${solicitud.servicioCatering.nombre}">
                                Servicio
                            </div>

                        </div>

                        <div class="detalle-item">

                            <div class="detalle-etiqueta">
                                Cantidad de asistentes
                            </div>

                            <div class="detalle-valor"
                                 th:text="${solicitud.cantidadAsistentes
                                 + ' personas'}">
                                1 persona
                            </div>

                        </div>

                        <div class="detalle-item">

                            <div class="detalle-etiqueta">
                                Precio por persona
                            </div>

                            <div class="detalle-valor"
                                 th:text="${'$'
                                 + #numbers.formatDecimal(
                                 solicitud.servicioCatering.precioPorPersona,
                                 1,
                                 2
                                 )}">
                                $0.00
                            </div>

                        </div>

                        <div class="detalle-item ancho-completo">

                            <div class="detalle-etiqueta">Lugar</div>

                            <div class="detalle-valor"
                                 th:text="${solicitud.lugar}">
                                Lugar
                            </div>

                        </div>

                        <div class="detalle-item ancho-completo">

                            <div class="detalle-etiqueta">
                                Menú solicitado
                            </div>

                            <div class="detalle-valor"
                                 th:text="${solicitud.menu}">
                                Menú
                            </div>

                        </div>

                    </div>

                    <div class="acciones-formulario">

                        <a class="boton-secundario"
                           href="/solicitudes-catering"
                           th:href="@{/solicitudes-catering}">
                            Volver al listado
                        </a>

                        <a class="boton-guardar"
                           th:href="@{/solicitudes-catering/actualizar/{id}
                           (id=${solicitud.idSolicitud})}">
                            Editar Solicitud
                        </a>

                    </div>

                </div>

            </div>

        </main>

    </section>

</div>

</body>
</html>
