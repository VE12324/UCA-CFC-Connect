<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Actualizar categoría</title>

    <link rel="stylesheet" href="/css/estilos.css" th:href="@{/css/estilos.css}">
</head>
<body>
<div class="aplicacion">
    <aside th:replace="~{fragmentos/plantilla :: barra-lateral('categorias')}"></aside>

    <section class="area-principal">
        <header th:replace="~{fragmentos/plantilla :: barra-superior}"></header>
        <main class="contenido">
            <div class="formulario-tarjeta">
                <div class="tarjeta-encabezado">

                    <h1>Actualizar categoría</h1>
                    <p>
                        Modifique la información de la categoría seleccionada.
                    </p>
                </div>
                <div class="tarjeta-cuerpo">

                    <form th:action="@{/categorias/actualizar/{id}(id=${categoria.idCategoria})}"
                          th:object="${categoria}"
                          method="post">
                        <div class="formulario-cuadricula">

                            <div class="grupo-formulario ancho-completo">

                                <label for="nombre">
                                    Nombre de la categoría *
                                </label>
                                <input class="campo-formulario"
                                       id="nombre"
                                       type="text"
                                       th:field="*{nombre}"
                                       th:classappend="${#fields.hasErrors('nombre')} ? 'invalido' : ''"
                                       maxlength="100"
                                       placeholder="Ej. Tecnología">


                                <span class="texto-error"
                                      th:if="${#fields.hasErrors('nombre')}"
                                      th:errors="*{nombre}">
                               </span>


                            </div>


                            <div class="grupo-formulario ancho-completo">


                                <label for="descripcion">
                                    Descripción
                                </label>


                                <textarea class="campo-formulario"
                                          id="descripcion"
                                          th:field="*{descripcion}"
                                          th:classappend="${#fields.hasErrors('descripcion')} ? 'invalido' : ''"
                                          maxlength="255"
                                          placeholder="Describa brevemente la categoría">
                               </textarea>
                                <span class="texto-error"
                                      th:if="${#fields.hasErrors('descripcion')}"
                                      th:errors="*{descripcion}">
                               </span>
                            </div>
                        </div>

                        <div class="acciones-formulario">


                            <a class="boton-secundario"
                               href="/categorias"
                               th:href="@{/categorias}">
                                Cancelar
                            </a>

                            <button class="boton-guardar"
                                    type="submit">
                                Guardar cambios
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </section>
</div>
</body>
</html>
