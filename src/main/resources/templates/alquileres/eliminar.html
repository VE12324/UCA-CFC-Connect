<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Eliminar Alquiler</title>

    <link rel="stylesheet"
          href="/css/estilos.css"
          th:href="@{/css/estilos.css}">
</head>

<body>

<div class="aplicacion">

    <aside th:replace="~{fragmentos/plantilla :: barra-lateral('alquileres')}"></aside>

    <section class="area-principal">

        <header th:replace="~{fragmentos/plantilla :: barra-superior}"></header>

        <main class="contenido">

            <div class="eliminar-tarjeta">

                <div class="tarjeta-encabezado">

                    <h1>Eliminar Alquiler</h1>

                    <p>
                        Confirme la eliminación de la reservación.
                    </p>

                </div>

                <div class="tarjeta-cuerpo">

                    <div class="advertencia-eliminar">

                        <h2>
                            ¿Está seguro de eliminar este alquiler?
                        </h2>

                        <p>
                            Si existen pagos o actividades asociadas,
                            el alquiler no podrá eliminarse.
                        </p>

                    </div>

                    <div class="detalles-cuadricula">

                        <div class="detalle-item">

                            <div class="detalle-etiqueta">ID</div>

                            <div class="detalle-valor"
                                 th:text="${alquiler.idAlquiler}">
                                1
                            </div>

                        </div>

                        <div class="detalle-item">

                            <div class="detalle-etiqueta">Estado</div>

                            <div class="detalle-valor"
                                 th:text="${alquiler.estado}">
                                PENDIENTE
                            </div>

                        </div>

                        <div class="detalle-item ancho-completo">

                            <div class="detalle-etiqueta">Cliente</div>

                            <div class="detalle-valor"
                                 th:text="${alquiler.cliente.nombre}">
                                Cliente
                            </div>

                        </div>

                        <div class="detalle-item ancho-completo">

                            <div class="detalle-etiqueta">Espacio</div>

                            <div class="detalle-valor"
                                 th:text="${alquiler.espacio.nombre}">
                                Espacio
                            </div>

                        </div>

                        <div class="detalle-item">

                            <div class="detalle-etiqueta">Inicio</div>

                            <div class="detalle-valor"
                                 th:text="${#temporals.format(
                                 alquiler.horaInicio,
                                 'dd/MM/yyyy HH:mm'
                                 )}">
                                01/01/2026 08:00
                            </div>

                        </div>

                        <div class="detalle-item">

                            <div class="detalle-etiqueta">Finalización</div>

                            <div class="detalle-valor"
                                 th:text="${#temporals.format(
                                 alquiler.horaFin,
                                 'dd/MM/yyyy HH:mm'
                                 )}">
                                01/01/2026 10:00
                            </div>

                        </div>

                    </div>

                    <form method="post"
                          th:action="@{/alquileres/eliminar/{id}
                          (id=${alquiler.idAlquiler})}">

                        <div class="acciones-formulario">

                            <a class="boton-secundario"
                               href="/alquileres"
                               th:href="@{/alquileres}">
                                Cancelar
                            </a>

                            <button class="boton-confirmar"
                                    type="submit">
                                Confirmar y Eliminar
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </main>

    </section>

</div>

</body>
</html>
