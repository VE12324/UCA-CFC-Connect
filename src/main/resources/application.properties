spring.application.name=sistema-uca


spring.datasource.url=jdbc:mysql://localhost:3306/sistema_uca?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


spring.thymeleaf.check-template-location=false


# JWT para la API REST (/api/**).
# El valor por defecto es SOLO para desarrollo: en otro ambiente definir la variable JWT_SECRET
# (mínimo 32 caracteres) y, si se desea, JWT_EXPIRATION_MS.
app.jwt.secret=${JWT_SECRET:uca-cfc-connect-clave-de-desarrollo-cambiar-en-produccion-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}


