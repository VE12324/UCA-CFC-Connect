# Nombre de la aplicación
spring.application.name=uca-cfc-connect

# ---- Base de datos (ajustar según MySQL o PostgreSQL) ----
# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/uca_cfc_connect
spring.datasource.username=root
spring.datasource.password=

# PostgreSQL (usar en lugar de las líneas de MySQL si aplica)
# spring.datasource.url=jdbc:postgresql://localhost:5432/uca_cfc_connect
# spring.datasource.username=postgres
# spring.datasource.password=

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
jwt.secret=cambiar-esta-clave-por-una-segura
jwt.expiration-ms=86400000

# ---- Swagger / OpenAPI ----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
